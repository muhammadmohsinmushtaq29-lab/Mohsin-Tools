:root{--bg:#f3f7fc;--panel:#fff;--ink:#17243d;--muted:#687790;--line:#dce5f1;--nav:#10244a;--blue:#246bfe;--cyan:#1dc8e8;--soft:#eaf2ff;--shadow:0 12px 34px #10244a12}

#dm .dm-b:hover:not(:disabled){transform:translateY(-2px)}#dm .dm-b:disabled{opacity:.5;cursor:not-allowed}
#dm .dm-b.p{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.3)}#dm .dm-b.lg{padding:13px 22px;font-size:16px}
#dm .dm-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#dm .dm-c{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600}#dm .dm-c.on{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-color:transparent}
#dm .dm-tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
#dm .dm-t{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}#dm .dm-t th,#dm .dm-t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
#dm .dm-t th{background:var(--soft);position:sticky;top:0}#dm .dm-t th small{display:block;font-weight:500;color:var(--muted)}
#dm .dm-t td.nm{text-align:start}#dm .nm b{display:block}#dm .nm small{color:var(--muted)}
#dm .dm-in{width:70px;text-align:center;padding:6px}#dm .dm-in.bad{border-color:#ef4444;background:#fee2e2;color:#7f1d1d}
#dm tr.gh td{background:var(--soft);font-weight:700;text-align:start;color:var(--blue)}#dm td.empty{padding:26px;color:var(--muted)}
#dm .dm-tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}#dm .dm-tag.ok{background:#16a34a}#dm .dm-tag.no{background:#dc2626}
#dm .dm-ib{border:1px solid var(--line);background:var(--soft);border-radius:9px;width:32px;height:32px;margin:0 2px}
#dm .dm-msg{padding:10px 14px;border-radius:12px;margin-top:12px;background:var(--soft);font-weight:600;border-left:4px solid var(--cyan)}#dm .dm-msg.err{border-color:#ef4444}#dm .dm-msg.warn{border-color:#f59e0b}#dm .dm-msg.ok{border-color:#16a34a}#dm .dm-msg ul{margin:6px 0 0;padding-left:20px;font-weight:500}
#dm .dm-hint{color:var(--muted);font-size:13px;min-height:18px;margin:8px 0 0}#dm .big{margin-top:16px}
#dm .dm-ov{position:fixed;inset:0;z-index:9000;background:rgba(5,10,25,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}#dm .dm-ov[hidden]{display:none}
#dm .dm-dlg{background:var(--panel);color:var(--ink);border-radius:20px;padding:18px;width:min(900px,100%);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#dm .dm-dh{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
#dm .dm-pv canvas{display:block;width:100%;max-width:640px;height:auto;margin:0 auto;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);background:#fff}
#dmPrint{display:none}
@media(max-width:760px){#dm .dm-two{grid-template-columns:1fr}#dm .dm-b.lg{width:100%}}
@media(max-width:480px){#dm .dm-box{padding:13px}#dm .dm-ov{padding:8px}}
@media(prefers-reduced-motion:reduce){#dm *{animation:none!important;transition:none!important}}
</style>

const saved=()=>{try{return JSON.parse(localStorage.getItem("mt_saved")||"[]")}catch{return[]}};
function saveItem(type,title,data){let arr=saved();arr.unshift({id:Date.now(),type,title,data,date:new Date().toLocaleDateString()});localStorage.setItem("mt_saved",JSON.stringify(arr.slice(0,100)));toast("Saved in this browser");}
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;right:20px;background:#10244a;color:white;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:0 8px 24px #0003";document.body.append(t)}t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2500)}
function btn(label,action,kind=""){return `<button class="btn ${kind}" ${action}>${label}</button>`}
function field(label,id,placeholder="",type="text",value=""){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${value}"></div>`}
function selectField(label,id,opts){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(x=>`<option>${x}</option>`).join("")}</select></div>`}
function pageHead(title,desc){return `<h1 class="page-title">${title}</h1><p class="sub">${desc}</p>`}
function card(t){return `<article class="tool-card" tabindex="0" data-tool="${t.id}"><div class="tool-icon">${t.icon}</div><h3>${t.name}</h3><p>${t.desc}</p><div class="card-foot"><span>Open tool ↗</span><span class="pill">${t.cat}</span></div></article>`}
function toolGrid(list){return `<div class="grid">${list.map(card).join("")}</div>`}
function home(){return `<section class="hero"><div class="hero-logo"><div class="hl-float"><div class="hl-frame"><img src="${HERO_LOGO}" alt="Muhammad Mohsin Mushtaq" width="432" height="432" decoding="async"></div></div><div class="hl-shadow"></div></div><div class="eyebrow">Your all-in-one productivity workspace</div><h1>Learn Smarter.<br>Create Faster.</h1><p>One workspace for students, teachers, schools, designers, and creators. Build useful things, organize your work, and print with confidence.</p>${btn("Explore all tools","data-goto=\"alltools\"","primary")} ${btn("Create an exam paper","data-goto=\"paper\"","soft")}</section>

const MK_KEY="mt_marks";

let mkStore=null,mkCls="Class 8";
function mkRead(){try{const s=JSON.parse(localStorage.getItem(MK_KEY)||"null");if(s&&s.classes&&s.meta)return s}catch{}return {meta:{school:"",exam:"Annual Exam",pass:33,sort:"Position",cls:"Class 8"},classes:{}}}
function mkWrite(){try{mkStore.meta.cls=mkCls;localStorage.setItem(MK_KEY,JSON.stringify(mkStore))}catch{toast("Could not save in this browser")}}
function mkBlank(d){return {r:"",n:"",m:d.subjects.map(()=>"")}}
function mkData(){if(!mkStore.classes[mkCls]){const d={subjects:["Urdu","English","Mathematics","Science","Islamiyat"].map(n=>({n,t:100})),students:[]};for(let i=0;i<5;i++)d.students.push(mkBlank(d));mkStore.classes[mkCls]=d}return mkStore.classes[mkCls]}
function mkGrade(p,pass){return p<pass?"F":p>=80?"A+":p>=70?"A":p>=60?"B":p>=50?"C":p>=40?"D":"E"}
function mkCompute(){
 const d=mkData(),pass=Number(mkStore.meta.pass)||33,grand=d.subjects.reduce((a,s)=>a+(Number(s.t)||0),0);
 const rows=d.students.map((s,i)=>{
  let total=0,fail=false,bad=false,any=false;
  const cells=d.subjects.map((sub,j)=>{const raw=String(s.m[j]??"").trim(),t=Number(sub.t)||0;
   if(raw==="")return {raw,v:0};
   const v=Number(raw);if(!Number.isFinite(v)||v<0||v>t){bad=true;return {raw,v:0,bad:true}}
   any=true;return {raw,v}});
  cells.forEach((x,j)=>{total+=x.v;const t=Number(d.subjects[j].t)||0;if(t>0&&x.v/t*100<pass)fail=true});
  const pct=grand>0?total/grand*100:0,active=!!(s.n.trim()||s.r.trim()||any);
  return {i,s,cells,total,pct,bad,active,grade:mkGrade(pct,pass),result:bad?"Check marks":(fail||pct<pass)?"Fail":"Pass"};
 });
 const act=rows.filter(r=>r.active);
 rows.forEach(r=>{r.pos=r.active?1+act.filter(o=>o.total>r.total).length:""});
 return {d,rows,act,grand,pass};
}

let qz={school:"",title:"",cls:"",time:"",qs:[]},qzShowKey=false,qzPractice=false,qzAns=[],qzChecked=false;
const QZL=["A","B","C","D"];
function qzBlank(){return {q:"",o:["","","",""],a:0}}
function qzLoad(){qz={school:"",title:"",cls:"",time:"",qs:[qzBlank(),qzBlank(),qzBlank()]};try{const s=JSON.parse(localStorage.getItem("mt_quiz")||"null");if(s&&Array.isArray(s.qs)&&s.qs.length){qz=Object.assign(qz,s);qz.qs=qz.qs.map(x=>({q:String(x.q||""),o:[0,1,2,3].map(j=>String((x.o||[])[j]||"")),a:[0,1,2,3].includes(x.a)?x.a:0}))}}catch{}qzShowKey=false;qzPractice=false;qzAns=[];qzChecked=false}

function qzListHtml(){return qz.qs.map((x,i)=>`<div class="resource" style="display:block;margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Question ${i+1}</b><button class="btn danger" data-qzdel="${i}" aria-label="Remove question ${i+1}">✕</button></div><div class="field"><textarea data-qz="q" data-i="${i}" aria-label="Question ${i+1}" placeholder="Type the question" style="min-height:60px">${escapeHtml(x.q)}</textarea></div><div class="form-grid" style="margin-top:8px">${QZL.map((L,j)=>`<div class="field"><label>Option ${L}</label><input data-qz="o" data-i="${i}" data-j="${j}" value="${escapeHtml(x.o[j])}"></div>`).join("")}<div class="field"><label>Correct answer</label><select data-qz="a" data-i="${i}">${QZL.map((L,j)=>`<option value="${j}"${x.a===j?" selected":""}>${L}</option>`).join("")}</select></div></div></div>`).join("")}
function qzRender(){
 const el=$("#qzPreview");if(!el)return;
 const list=qz.qs.filter(x=>x.q.trim());
 const head=`<div class="paper-head"><h2 style="margin:0">${escapeHtml(qz.school||"School / Institution")}</h2><h3 style="margin:4px 0">${escapeHtml(qz.title||"MCQ Test")}</h3><p style="margin:0">${qz.cls?"Class: "+escapeHtml(qz.cls)+" · ":""}${qz.time?"Time: "+escapeHtml(qz.time)+" · ":""}Total Marks: ${list.length}</p>${qzPractice?"":`<p style="margin:8px 0 0">Name: ____________________ &nbsp; Roll No: __________ &nbsp; Date: __________</p>`}</div>`;
 if(!list.length){el.innerHTML=head+`<div class="empty">Add at least one question to see the paper.</div>`;return}
 let score=0;
 const body=list.map((x,n)=>{
  const opts=QZL.map((Lt,j)=>({Lt,j,t:x.o[j].trim()})).filter(p=>p.t);
  if(qzPractice){
   if(qzChecked&&qzAns[n]===x.a)score++;
   return `<div class="paper-question" style="break-inside:avoid"><b>${n+1}. ${escapeHtml(x.q)}</b>${opts.map(p=>{const right=qzChecked&&p.j===x.a,wrong=qzChecked&&qzAns[n]===p.j&&p.j!==x.a;return `<label style="display:block;margin:4px 0;${right?"color:#14803c;font-weight:700":""}${wrong?"color:#c53b4c;text-decoration:line-through":""}"><input type="radio" name="qzr${n}" data-qzr="${n}" value="${p.j}"${qzAns[n]===p.j?" checked":""}${qzChecked?" disabled":""}> (${p.Lt}) ${escapeHtml(p.t)}${right?" ✓":""}</label>`}).join("")}</div>`}
  return `<div class="paper-question" style="break-inside:avoid"><b>${n+1}. ${escapeHtml(x.q)}</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;margin-top:6px">${opts.map(p=>`<div>(${p.Lt}) ${escapeHtml(p.t)}</div>`).join("")}</div></div>`}).join("");
 let extra="";
 if(qzPractice)extra=qzChecked?`<div class="result"><strong>${score} / ${list.length}</strong>${Math.round(score/list.length*100)}% correct. Correct answers are in green.</div><div class="actions no-print">${btn("Try again",'id="qzRetry"',"primary")}</div>`:`<div class="actions no-print">${btn("Check answers",'id="qzCheck"',"primary")}</div>`;
 else if(qzShowKey)extra=`<div style="margin-top:18px;border-top:2px solid #263d5e;padding-top:10px;break-inside:avoid"><b>Answer key</b><div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px">${list.map((x,n)=>`<span>${n+1}. ${x.o[x.a].trim()?QZL[x.a]:"?"}</span>`).join("")}</div></div>`;
 el.innerHTML=head+body+extra;
}

function spPage(){return `${pageHead("Study Planner","Create a weekly study plan from your subjects and daily study hours, edit any slot, then print it.")}<div class="panel"><div class="form-grid">${field("Student name","spName","Your name")}${field("Goal / exam","spGoal","e.g. Final Exam 2026")}<div class="field full"><label for="spSubjects">Subjects (comma separated)</label><input id="spSubjects" value="Urdu, English, Mathematics, Science, Islamiyat"></div>${field("Study hours per day","spHours","3","number","3")}${selectField("Session length","spLen",["60 minutes","45 minutes","30 minutes"])}${field("Start time","spStart","","time","16:00")}${selectField("Study days","spDays",["Monday–Friday","Monday–Saturday","All 7 days"])}</div><div class="actions no-print">${btn("Create plan",'id="spBuild"',"primary")}${btn("Download CSV",'id="spCsv"')}${btn("Print / Save PDF",'id="printBtn"')}${btn("Save project",'id="spSave"')}</div><div id="spOut" class="table-wrap" style="margin-top:20px"></div></div>`}
function spBuild(){
 const out=$("#spOut");if(!out)return;
 const subs=($("#spSubjects").value||"").split(/[,،]/).map(s=>s.trim()).filter(Boolean),hours=Number($("#spHours").value),len=parseInt($("#spLen").value)||60,st=$("#spStart").value||"16:00";
 if(!subs.length||!(hours>=0.5)||hours>12){out.innerHTML='<div class="notice">Enter at least one subject and study hours between 0.5 and 12.</div>';return}
 const per=Math.min(24,Math.max(1,Math.floor(hours*60/len))),dv=$("#spDays").value;
 const days=["Monday","Tuesday","Wednesday","Thursday","Friday"];if(dv==="Monday–Saturday")days.push("Saturday");if(dv==="All 7 days")days.push("Saturday","Sunday");
 const [h0,m0]=st.split(":").map(Number),fmt=m=>{m=m%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
 const rows=[];for(let s=0;s<per;s++)rows.push({time:`${fmt(h0*60+m0+s*len)}–${fmt(h0*60+m0+(s+1)*len)}`,cells:[]});
 let k=0;days.forEach(()=>rows.forEach(r=>r.cells.push(subs[k++%subs.length])));
 const title=[$("#spName").value.trim(),$("#spGoal").value.trim()].filter(Boolean).join(" · ")||"Weekly study plan";
 out.innerHTML=`<h2>${escapeHtml(title)}</h2><p class="sub" style="margin-bottom:12px">${per} session${per>1?"s":""} of ${len} minutes per day. Subjects rotate so each gets equal time. Click any cell to change it.</p><table id="spTable"><thead><tr><th>Time</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><th>${r.time}</th>${r.cells.map((c,i)=>`<td><input aria-label="${days[i]} ${r.time}" value="${escapeHtml(c)}"></td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function spRows(){const t=$("#spTable");return t?$$("tr",t).map(tr=>$$("th,td",tr).map(c=>c.querySelector("input")?c.querySelector("input").value:c.textContent.trim())):[]}
document.addEventListener("click",e=>{
 if(!$("#spOut"))return;
 if(e.target.id==="spBuild")spBuild();
 if(e.target.id==="spCsv"){if(!$("#spTable"))spBuild();const r=spRows();if(r.length)csvDownload("Mohsin-Tools-Study-Plan.csv",r)}
 if(e.target.id==="spSave"){if(!$("#spTable"))spBuild();saveItem("Study Plan",$("#spGoal").value||$("#spName").value||"Study plan",spRows())}
});

function imgShrink(file,max,cb){if(!file)return;if(!file.type.startsWith("image/")){alert("Please choose an image file (JPG, PNG or WebP).");return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",.88))};im.onerror=()=>alert("Could not read this image.");im.src=r.result};r.onerror=()=>alert("Could not read this image.");r.readAsDataURL(file)}

 else if(id==="cePhoto")imgShrink(e.target.files&&e.target.files[0],600,d=>{cePhotoData=d;ceRender()});
 else if(/^ce[A-Z]/.test(id)){if(id==="ceTpl"&&$("#ceColor"))$("#ceColor").value=(CE_TPL[e.target.value]||CE_TPL["Modern Blue"]).cc;ceRender()}});

 if(e.target.id==="ceRmLogo"){ceLogoData="";if($("#ceLogo"))$("#ceLogo").value="";ceRender()}

/* ===== Photo cropper (JPG / JPEG / PNG), background change, Passport Photo Maker ===== */
const PC_BG={original:null,white:"#ffffff",blue:"#1f4fd8",black:"#000000"};
function pcValidate(f){const ext=(f.name.split(".").pop()||"").toLowerCase();if(!["image/jpeg","image/png"].includes(f.type)||!["jpg","jpeg","png"].includes(ext)){alert("Only JPG, JPEG or PNG photos are allowed.");return false}if(f.size>12e6){alert("The photo must be under 12 MB.");return false}return true}
function pcBgReplace(cv,hex,tol){
 const w=cv.width,h=cv.height,ctx=cv.getContext("2d"),im=ctx.getImageData(0,0,w,h),d=im.data,S=[];
 const take=(x,y)=>{const i=(y*w+x)*4;S.push([d[i],d[i+1],d[i+2]])},sx=Math.max(1,w>>5),sy=Math.max(1,h>>5);
 for(let x=0;x<w;x+=sx){take(x,0);take(x,Math.min(2,h-1))}
 for(let y=0;y<h*.35;y+=sy){take(0,y);take(w-1,y)}
 const med=c=>S.map(s=>s[c]).sort((a,b)=>a-b)[S.length>>1],bg=[med(0),med(1),med(2)],t2=tol*tol,mask=new Uint8Array(w*h),st=[];
 const near=p=>{const i=p*4,a=d[i]-bg[0],b=d[i+1]-bg[1],c=d[i+2]-bg[2];return a*a+b*b+c*c<=t2};
 const push=p=>{if(!mask[p]&&near(p)){mask[p]=1;st.push(p)}};
 for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
 while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;if(x>0)push(p-1);if(x<w-1)push(p+1);if(y>0)push(p-w);if(y<h-1)push(p+w)}
 const dil=new Uint8Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let m=0;for(let j=-1;j<=1&&!m;j++){const yy=y+j;if(yy<0||yy>=h)continue;for(let i=-1;i<=1;i++){const xx=x+i;if(xx>=0&&xx<w&&mask[yy*w+xx]){m=1;break}}}dil[y*w+x]=m}
 const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let j=-1;j<=1;j++){const yy=y+j;if(yy<0||yy>=h)continue;for(let i=-1;i<=1;i++){const xx=x+i;if(xx>=0&&xx<w){s+=dil[yy*w+xx];n++}}}const a=s/n;if(a>0){const k=(y*w+x)*4;d[k]=d[k]*(1-a)+r*a;d[k+1]=d[k+1]*(1-a)+g*a;d[k+2]=d[k+2]*(1-a)+b*a}}
 ctx.putImageData(im,0,0);
}
function photoCropper(o){
 if(!o.file||!pcValidate(o.file))return;
 const url=URL.createObjectURL(o.file),img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);alert("Could not read this photo.")};
 img.onload=()=>start();img.src=url;
 function start(){
  const dw=280,dh=Math.round(dw*o.ah/o.aw),iw=img.naturalWidth,ih=img.naturalHeight,base=Math.max(dw/iw,dh/ih);
  let z=1,mode="original",tol=45,ox=0,oy=0,raf=0;const sc=()=>base*z;
  ox=(dw-iw*sc())/2;oy=(dh-ih*sc())/2;
  const back=document.createElement("div");back.className="pc-back";back.setAttribute("role","dialog");back.setAttribute("aria-modal","true");back.setAttribute("aria-label","Crop photo");
  back.innerHTML=`<div class="pc-box"><h2 style="margin:0 0 4px">Crop photo</h2><p class="muted" style="margin:0 0 10px;font-size:13px">Drag the photo to move it, use the slider to zoom. Output: ${o.label}.</p><div class="pc-stage"><canvas id="pcCanvas" width="${dw}" height="${dh}" aria-label="Photo crop area"></canvas></div><div class="field" style="margin-top:12px"><label for="pcZoom">Zoom</label><input type="range" id="pcZoom" min="1" max="4" step="0.01" value="1"></div><div class="field" style="margin-top:10px"><label>Background</label><div class="pc-opts" role="radiogroup" aria-label="Background">${[["original","Original",""],["white","White","#ffffff"],["blue","Blue","#1f4fd8"],["black","Black","#000000"]].map(b=>`<label class="pc-opt"><input type="radio" name="pcbg" value="${b[0]}"${b[0]==="original"?" checked":""}> ${b[2]?`<i style="background:${b[2]}"></i>`:""}${b[1]}</label>`).join("")}</div></div><div id="pcTolBox" style="display:none;margin-top:10px"><div class="field"><label for="pcTol">Background strength</label><input type="range" id="pcTol" min="10" max="120" step="1" value="45"></div><p class="muted" style="font-size:12px;margin:6px 0 0">Works best with a plain, evenly lit background (wall or sheet). Raise the strength if some old background is left, lower it if the person's hair or clothes are changing.</p></div><div class="actions"><button class="btn primary" id="pcOk">Use photo</button><button class="btn" id="pcCancel">Cancel</button></div></div>`;
  document.body.append(back);
  const cv=back.querySelector("#pcCanvas"),ctx=cv.getContext("2d");
  const clamp=()=>{ox=Math.min(0,Math.max(dw-iw*sc(),ox));oy=Math.min(0,Math.max(dh-ih*sc(),oy))};
  const draw=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,dw,dh);ctx.imageSmoothingQuality="high";ctx.drawImage(img,ox,oy,iw*sc(),ih*sc());if(PC_BG[mode])pcBgReplace(cv,PC_BG[mode],tol)};
  const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
  draw();
  let drag=null;
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
  cv.addEventListener("pointermove",e=>{if(!drag)return;ox+=e.clientX-drag.x;oy+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};clamp();redraw()});
  const end=()=>{drag=null;cv.style.cursor="grab"};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  back.querySelector("#pcZoom").addEventListener("input",e=>{const cx=(dw/2-ox)/sc(),cy=(dh/2-oy)/sc();z=Number(e.target.value);ox=dw/2-cx*sc();oy=dh/2-cy*sc();clamp();redraw()});
  back.querySelectorAll('input[name="pcbg"]').forEach(r=>r.addEventListener("change",()=>{mode=r.value;back.querySelector("#pcTolBox").style.display=mode==="original"?"none":"block";redraw()}));
  back.querySelector("#pcTol").addEventListener("input",e=>{tol=Number(e.target.value);redraw()});
  const close=()=>{document.removeEventListener("keydown",esc);back.remove();URL.revokeObjectURL(url)},esc=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",esc);
  back.querySelector("#pcCancel").onclick=close;
  back.addEventListener("mousedown",e=>{if(e.target===back)close()});
  back.querySelector("#pcOk").onclick=()=>{const out=document.createElement("canvas");out.width=o.outW;out.height=o.outH;const c=out.getContext("2d"),k=o.outW/dw;c.fillStyle="#fff";c.fillRect(0,0,out.width,out.height);c.imageSmoothingQuality="high";c.drawImage(img,ox*k,oy*k,iw*sc()*k,ih*sc()*k);if(PC_BG[mode])pcBgReplace(out,PC_BG[mode],tol);close();o.onDone(out)};
  back.querySelector("#pcZoom").focus();
 }
}

function idCropOpen(file){idPhotoFile=file;photoCropper({file,aw:4,ah:5,outW:160,outH:200,label:"160 × 200 px",onDone:cv=>{idPhotoData=cv.toDataURL("image/jpeg",.92);updateID()}})}

let ppSrc=null,ppCanvas=null,ppData="";
function passportPage(){ppSrc=null;ppCanvas=null;ppData="";return `${pageHead("Passport Photo Maker","Crop your photo to passport size (3.5 × 4.5 cm), change the background to white, blue or black, then print copies on an A4 sheet.")}<div class="two-col"><section class="panel no-print"><div class="field"><label for="ppFile">Photo (JPG, JPEG or PNG)</label><input id="ppFile" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png"></div><div class="actions">${btn("Crop / change background",'id="ppCrop"',"primary")}</div><div class="form-grid" style="margin-top:14px">${selectField("Copies on A4","ppCopies",["4","6","8","10","12","15","20","25"])}${selectField("Cut lines","ppLines",["Show","Hide"])}${selectField("Download as","ppFmt",["JPG","PNG"])}</div><div class="actions">${btn("Download photo",'id="ppDl"')}${btn("Print A4 sheet",'id="ppPrint"',"primary")}</div><div class="notice" style="margin-top:16px">Photo size: 3.5 × 4.5 cm (413 × 531 px at 300 dpi). Print at 100% / “Actual size” on A4 paper, not “Fit to page”, then cut along the lines.</div></section><section class="panel"><h2 class="no-print">A4 sheet preview</h2><div id="ppSheetWrap"></div></section></div>`}
function ppRender(){
 const w=$("#ppSheetWrap");if(!w)return;
 if(!ppData){w.innerHTML=`<div class="empty">Choose a photo and crop it. The A4 sheet appears here.</div>`;return}
 const n=Number($("#ppCopies").value)||8,cut=$("#ppLines").value!=="Hide";
 w.innerHTML=`<div class="a4wrap"><div class="a4sheet${cut?" cut":""}">${Array.from({length:n},()=>`<img src="${ppData}" alt="Passport photo">`).join("")}</div></div>`;
}
function ppCropOpen(file){ppSrc=file;photoCropper({file,aw:7,ah:9,outW:413,outH:531,label:"3.5 × 4.5 cm (413 × 531 px)",onDone:cv=>{ppCanvas=cv;ppData=cv.toDataURL("image/jpeg",.95);ppRender()}})}
document.addEventListener("change",e=>{
 const id=e.target.id,f=e.target.files&&e.target.files[0];
 if(id==="idPhoto"){if(f)idCropOpen(f);return}
 if(id==="ppFile"){if(f){if(pcValidate(f))ppCropOpen(f);else e.target.value=""}return}
 if(id==="ppCopies"||id==="ppLines")ppRender();
});
document.addEventListener("click",e=>{
 const id=e.target.id;
 if(id==="idCrop"){if(!idPhotoFile){alert("Choose a photo first.");return}idCropOpen(idPhotoFile)}
 if(id==="ppCrop"){if(!ppSrc){alert("Choose a photo first.");return}ppCropOpen(ppSrc)}
 if(id==="ppDl"){if(!ppCanvas){alert("Choose and crop a photo first.");return}const png=$("#ppFmt").value==="PNG",a=document.createElement("a");a.href=ppCanvas.toDataURL(png?"image/png":"image/jpeg",.95);a.download="passport-photo."+(png?"png":"jpg");document.body.append(a);a.click();a.remove()}
 if(id==="ppPrint"){if(!ppData){alert("Choose and crop a photo first.");return}let st=$("#mkPageStyle");if(!st){st=document.createElement("style");st.id="mkPageStyle";document.head.append(st)}st.textContent="@media print{@page{size:A4 portrait;margin:0}}";window.print()}
});

/* ===== Login / Sign up (accounts are stored in this browser only) ===== */
const AU_USERS="mt_users",AU_SESSION="mt_session";
const auUsers=()=>{try{return JSON.parse(localStorage.getItem(AU_USERS)||"{}")}catch{return{}}};
const auPutUsers=u=>localStorage.setItem(AU_USERS,JSON.stringify(u));
function auSession(){try{return JSON.parse(sessionStorage.getItem(AU_SESSION)||localStorage.getItem(AU_SESSION)||"null")}catch{return null}}
const auB64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),auUn=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function auHash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return auB64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256))}
let auFails=0,auLockUntil=0,auTab="login";
function authRender(){
 const a=$("#authArea");if(!a)return;const s=auSession();
 a.innerHTML=s?`<button class="btn" id="auChip" title="${escapeHtml(s.email)}">👤 ${escapeHtml(s.name.split(" ")[0])}</button>`:`<button class="btn" id="auOpenLogin">Login</button><button class="btn primary" id="auOpenSignup">Sign up</button>`;
}
function auClose(){const m=$("#auModal");if(m)m.remove();document.removeEventListener("keydown",auEsc)}
function auEsc(e){if(e.key==="Escape")auClose()}
function auOpen(tab){
 auClose();auTab=tab;const s=auSession();
 const back=document.createElement("div");back.className="pc-back";back.id="auModal";back.setAttribute("role","dialog");back.setAttribute("aria-modal","true");back.setAttribute("aria-label",s?"Account":"Login or sign up");
 back.innerHTML=`<div class="pc-box" style="max-width:400px"><div id="auBody"></div></div>`;
 document.body.append(back);document.addEventListener("keydown",auEsc);
 back.addEventListener("mousedown",e=>{if(e.target===back)auClose()});
 auBody();
}
function auBody(){
 const b=$("#auBody");if(!b)return;const s=auSession();
 if(s){b.innerHTML=`<h2 style="margin:0 0 4px">Your account</h2><p style="margin:0 0 14px"><b>${escapeHtml(s.name)}</b><br><span class="muted">${escapeHtml(s.email)}</span></p><div class="actions"><button class="btn primary" id="auLogout">Logout</button><button class="btn danger" id="auDelete">Delete account</button><button class="btn" id="auCancel">Close</button></div><p class="au-note">Accounts and saved projects live only in this browser on this device.</p>`;return}
 const su=auTab==="signup";
 b.innerHTML=`<div class="au-tabs" role="tablist"><button role="tab" id="auTabLogin" aria-selected="${!su}">Login</button><button role="tab" id="auTabSignup" aria-selected="${su}">Sign up</button></div><form id="auForm" novalidate>${su?`<div class="field"><label for="auName">Full name</label><input id="auName" autocomplete="name" maxlength="60"></div>`:""}<div class="field" style="margin-top:10px"><label for="auEmail">Email</label><input id="auEmail" type="email" autocomplete="${su?"email":"username"}" inputmode="email"></div><div class="field" style="margin-top:10px"><label for="auPass">Password${su?" (at least 8 characters)":""}</label><input id="auPass" type="password" autocomplete="${su?"new-password":"current-password"}"></div>${su?`<div class="field" style="margin-top:10px"><label for="auPass2">Confirm password</label><input id="auPass2" type="password" autocomplete="new-password"></div>`:""}<label class="au-row"><input type="checkbox" id="auShow"> Show password</label>${su?"":`<label class="au-row"><input type="checkbox" id="auRemember" checked> Keep me logged in on this device</label>`}<div id="auErr" class="au-err" role="alert" aria-live="polite"></div><button class="btn primary" id="auSubmit" type="submit" style="width:100%;justify-content:center">${su?"Create account":"Login"}</button></form><p class="au-note">${su?"Already have an account? ":"New here? "}<a href="#" id="auSwitch">${su?"Login":"Create an account"}</a></p><p class="au-note">Accounts are stored only in this browser. They are not shared between devices and there is no password reset.</p>`;
 (su?$("#auName"):$("#auEmail")).focus();
}
async function auSubmit(){
 const err=m=>{$("#auErr").textContent=m},su=auTab==="signup",email=($("#auEmail").value||"").trim().toLowerCase(),pw=$("#auPass").value;
 if(!window.crypto||!crypto.subtle){err("This browser cannot create secure accounts here. Open the site over https.");return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err("Enter a valid email address.");return}
 const users=auUsers();
 if(su){
  const name=($("#auName").value||"").trim().replace(/\s+/g," ");
  if(name.length<2){err("Enter your full name.");return}
  if(pw.length<8){err("Password must be at least 8 characters.");return}
  if(pw!==$("#auPass2").value){err("The two passwords do not match.");return}
  if(users[email]){err("An account with this email already exists in this browser. Please log in.");return}
  const salt=crypto.getRandomValues(new Uint8Array(16));
  users[email]={name,salt:auB64(salt),hash:await auHash(pw,salt),created:Date.now()};auPutUsers(users);
  auStart(email,name,true);return;
 }
 const now=Date.now();if(now<auLockUntil){err(`Too many attempts. Try again in ${Math.ceil((auLockUntil-now)/1000)} seconds.`);return}
 const u=users[email];let ok=false;
 if(u){try{ok=(await auHash(pw,auUn(u.salt)))===u.hash}catch{ok=false}}
 if(!ok){auFails++;if(auFails>=5){auFails=0;auLockUntil=Date.now()+30000;err("Too many attempts. Try again in 30 seconds.")}else err("Incorrect email or password.");return}
 auFails=0;auStart(email,u.name,$("#auRemember").checked);
}
function auStart(email,name,remember){
 sessionStorage.removeItem(AU_SESSION);localStorage.removeItem(AU_SESSION);
 (remember?localStorage:sessionStorage).setItem(AU_SESSION,JSON.stringify({email,name}));
 auClose();authRender();toast("Welcome, "+name.split(" ")[0]+"!");
}
function auLogout(){sessionStorage.removeItem(AU_SESSION);localStorage.removeItem(AU_SESSION);auClose();authRender();toast("You are logged out")}
document.addEventListener("submit",e=>{if(e.target.id==="auForm"){e.preventDefault();auSubmit()}});
document.addEventListener("change",e=>{if(e.target.id==="auShow"){const t=e.target.checked?"text":"password";["auPass","auPass2"].forEach(i=>{const el=$("#"+i);if(el)el.type=t})}});
document.addEventListener("click",e=>{
 const t=e.target.closest("button,a");if(!t)return;
 if(t.id==="auOpenLogin")auOpen("login");
 else if(t.id==="auOpenSignup")auOpen("signup");
 else if(t.id==="auChip")auOpen("login");
 else if(t.id==="auTabLogin"||t.id==="auTabSignup"){auTab=t.id==="auTabSignup"?"signup":"login";auBody()}
 else if(t.id==="auSwitch"){e.preventDefault();auTab=auTab==="signup"?"login":"signup";auBody()}
 else if(t.id==="auCancel")auClose();
 else if(t.id==="auLogout")auLogout();
 else if(t.id==="auDelete"){const s=auSession();if(s&&confirm("Delete this account from this browser? This cannot be undone.")){const u=auUsers();delete u[s.email];auPutUsers(u);auLogout()}}
});

const LS=[
{k:"heart",i:"heart",t:"The Human Heart",c:"Note: some labels inside this picture are unclear. Use the explanation on the right for the correct names.",h:`<p><b>Structure.</b> The heart is a muscular pump about the size of a fist, lying between the lungs, slightly to the left. It has four chambers: two upper atria that receive blood and two lower ventricles that pump it out. A muscular wall, the septum, separates the right side from the left side so oxygen-poor and oxygen-rich blood never mix.</p><p><b>Valves.</b> Four valves keep blood moving one way: the tricuspid valve (right atrium to right ventricle), the pulmonary valve (right ventricle to pulmonary artery), the mitral valve (left atrium to left ventricle) and the aortic valve (left ventricle to aorta). The “lub-dub” sound is these valves closing.</p><p><b>Blood flow.</b> Oxygen-poor blood enters the right atrium through the superior and inferior vena cava, moves to the right ventricle, and is pumped through the pulmonary artery to the lungs. Oxygen-rich blood returns through the pulmonary veins to the left atrium, passes to the left ventricle, and is pumped through the aorta to the whole body. In diagrams, blue shows oxygen-poor blood and red shows oxygen-rich blood.</p><p><b>Why the left ventricle is thicker.</b> It must push blood around the entire body, so its wall is much thicker than the right ventricle, which only serves the nearby lungs.</p><p><b>Heart muscle supply.</b> The heart muscle gets its own blood from the coronary arteries. A blockage in them causes a heart attack. At rest the heart beats about 60–100 times a minute and pumps roughly 5 litres per minute.</p>`},
{k:"respiratory",i:"respiratory",t:"Respiratory System",h:`<p><b>Path of air.</b> Air enters through the nose or mouth and passes the nasal cavity, where it is warmed, moistened and filtered. It then moves through the pharynx (nasopharynx, oropharynx, laryngopharynx), the larynx (voice box), the trachea, the bronchi, the bronchioles and finally the alveoli.</p><p><b>Protective parts.</b> The epiglottis is a flap that covers the larynx when we swallow so food does not enter the airway. The trachea is held open by C-shaped rings of cartilage and lined with mucus and tiny hairs (cilia) that trap dust and germs. The sinuses (frontal, sphenoid and others) are air spaces in the skull that lighten it and add resonance to the voice.</p><p><b>Lungs.</b> The right lung has three lobes (superior, middle, inferior). The left lung has two lobes and a curved space called the cardiac notch, which leaves room for the heart. Each main bronchus divides into lobar (secondary) and then segmental (tertiary) bronchi, and into smaller and smaller bronchioles.</p><p><b>Gas exchange.</b> At the end of each bronchiole are clusters of tiny air sacs called alveoli, wrapped in capillaries. Oxygen diffuses from the alveoli into the blood, and carbon dioxide diffuses from the blood into the alveoli to be breathed out. Their thin walls and huge total surface area make this fast.</p><p><b>Breathing.</b> The diaphragm, a dome-shaped muscle under the lungs, contracts and flattens to draw air in, and relaxes to push air out.</p>`},
{k:"circulatory",i:"circulatory",t:"Blood Circulation in the Body",c:"Image: Encyclopaedia Britannica. Check its licence before public use.",h:`<p><b>Two circuits.</b> Pulmonary circulation carries blood from the heart to the lungs and back to pick up oxygen. Systemic circulation carries oxygen-rich blood from the heart to all organs and returns oxygen-poor blood to the heart.</p><p><b>Arteries, veins, capillaries.</b> Arteries carry blood away from the heart and have thick, elastic walls. Veins carry blood back to the heart and have thinner walls with valves that prevent backflow. Capillaries are microscopic vessels where oxygen, nutrients and wastes pass between blood and tissues.</p><p><b>Main vessels in the picture.</b> The aorta leaves the left ventricle and its arch gives off the common carotid arteries (to the head and brain) and the subclavian arteries (to the arms). The superior vena cava drains the upper body and the inferior vena cava drains the lower body into the right atrium. The celiac trunk, splenic, gastric and mesenteric arteries supply the stomach, spleen and intestines, the renal arteries supply the kidneys, and the iliac arteries supply the legs.</p><p><b>Portal system.</b> The portal vein carries nutrient-rich blood from the intestines to the liver, which processes nutrients and removes toxins before the blood returns to the heart through the hepatic veins.</p><p><b>Facts.</b> An adult has about 5 litres of blood. Blood carries oxygen, nutrients, hormones and heat, and removes carbon dioxide and wastes.</p>`},
{k:"dna",i:"dna",t:"Chemical Structure of DNA",c:"Image: Andy Brunning / Compound Interest (compoundchem.com), CC BY-NC-ND. Non-commercial use with credit, no changes.",h:`<p><b>What DNA is.</b> DNA (deoxyribonucleic acid) stores the instructions for building and running a living thing. It is a polymer made of repeating units called nucleotides.</p><p><b>Nucleotide.</b> Each nucleotide has three parts: a deoxyribose sugar, a phosphate group and a nitrogen base. Sugars and phosphates join in a chain called the sugar-phosphate backbone. The four bases are adenine (A), thymine (T), guanine (G) and cytosine (C).</p><p><b>Double helix.</b> Two strands twist around each other. Bases on opposite strands pair by hydrogen bonds: A with T (two bonds) and G with C (three bonds). This is called complementary base pairing. The two strands run in opposite directions.</p><p><b>From DNA to protein.</b> In transcription, the enzyme RNA polymerase opens the helix and copies one strand into messenger RNA (mRNA). RNA uses uracil (U) instead of thymine. The mRNA leaves the nucleus for the cytoplasm, where ribosomes carry out translation: every three bases (a codon) code for one amino acid, for example UUC for phenylalanine, CUG for leucine, AAC for asparagine and CCC for proline. Amino acids join to form a protein.</p><p><b>Copying.</b> Before a cell divides, DNA replicates: each strand acts as a template, so each new molecule has one old and one new strand.</p>`},
{k:"cell",i:"cell",t:"Cell Structure",h:`<p><b>Cell membrane.</b> A thin flexible layer that controls what enters and leaves the cell.</p><p><b>Cytoplasm.</b> The jelly-like fluid that fills the cell and holds the organelles; many chemical reactions happen here.</p><p><b>Nucleus.</b> The control centre. It contains the DNA and is surrounded by a nuclear envelope. The nucleolus inside it makes ribosome parts.</p><p><b>Ribosomes.</b> Tiny structures that build proteins. Some float freely and some attach to the rough endoplasmic reticulum.</p><p><b>Endoplasmic reticulum (ER).</b> A network of membranes. Rough ER (with ribosomes) makes and folds proteins; smooth ER makes lipids and helps detoxify.</p><p><b>Golgi complex.</b> Stacks of flattened sacs that modify, sort and package proteins and lipids for use or export.</p><p><b>Mitochondria.</b> The “powerhouses”. They release energy from food as ATP through cellular respiration.</p><p><b>Lysosomes and peroxisomes.</b> Lysosomes contain enzymes that digest waste and worn-out parts. Peroxisomes break down fatty acids and neutralize harmful hydrogen peroxide.</p><p><b>Vacuole.</b> A storage sac for water, food and waste (small in animal cells, large in plant cells).</p><p><b>Centrioles.</b> Small cylinders that help organize the spindle fibres during cell division.</p>`},
{k:"organs",i:"organs",t:"Organs of the Human Body",c:"Some labels in this picture are unclear. Use the explanation on the right.",h:`<p><b>Brain.</b> Controls thinking, memory, movement and body functions, and is protected by the skull.</p><p><b>Lungs.</b> Take in oxygen and release carbon dioxide.</p><p><b>Heart.</b> Pumps blood around the body through the blood vessels.</p><p><b>Stomach.</b> A muscular bag that mixes food with acid and enzymes and starts digesting proteins.</p><p><b>Liver.</b> The largest internal organ. It makes bile, stores sugar as glycogen, processes nutrients and removes toxins.</p><p><b>Pancreas.</b> Releases digestive enzymes and the hormones insulin and glucagon, which control blood sugar.</p><p><b>Small and large intestines.</b> The small intestine finishes digestion and absorbs nutrients; the large intestine absorbs water and forms faeces.</p><p><b>Kidneys.</b> Filter the blood, remove wastes as urine and balance water and salts. The urinary bladder stores the urine.</p><p><b>Organ systems.</b> Organs work in groups called systems: nervous, respiratory, circulatory, digestive and excretory, among others. No organ works alone.</p>`},
{k:"hierarchy",i:"hierarchy",t:"Biological Hierarchy",c:"Image: Alamy stock image. Check its licence before public use.",h:`<p>Living things are built in levels, each made of the one before it.</p><p><b>Atom</b> (example: oxygen) → <b>Molecule</b> (water, two hydrogen atoms and one oxygen atom) → <b>Macromolecule</b> (a protein folded as an alpha helix) → <b>Organelle</b> (a mitochondrion) → <b>Cell</b> (an intestinal enterocyte) → <b>Tissue</b> (the intestinal lining, or mucosa) → <b>Organ</b> (the stomach) → <b>Organ system</b> (the gastrointestinal tract) → <b>Organism</b> (a human).</p><p><b>Why it matters.</b> Each level has properties that the level below does not. A single atom is not alive, but cells, the smallest units of life, can carry out all life processes. Cells of one kind form a tissue, several tissues form an organ, and organs working together form a system.</p><p><b>Beyond the organism.</b> Groups of the same species form a population, different populations form a community, and a community with its environment forms an ecosystem.</p>`}];

function sync(p){
 const page=known.has(p)?p:"alltools";
 $$(".bn-item[data-page],.ms-item[data-page]").forEach(b=>{const on=b.dataset.page===page;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
 const a=$(".bn-item.on",track);

 if(c&&p!==last){c.classList.remove("enter");void c.offsetWidth;c.classList.add("enter");clearTimeout(after.t);after.t=setTimeout(()=>c.classList.remove("enter"),900)}

 if(t.hasAttribute("data-theme-choice"))return;
 t.classList.add("lift");clearTimeout(t._lt);t._lt=setTimeout(()=>t.classList.remove("lift"),700);
});

/* ---------- card tilt + background parallax (desktop, mouse only) ---------- */
let cur=null,raf=0,pr=0;const bg=$(".bg3d");
const rst=t=>{t.style.removeProperty("--rx");t.style.removeProperty("--ry")};
D.addEventListener("pointermove",e=>{
 if(e.pointerType!=="mouse"||reduce.matches||innerWidth<=720)return;
 const t=e.target.closest&&e.target.closest(".tool-card,.stat");
 if(cur&&cur!==t){rst(cur);cur=null}

  if(cur){const r=cur.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;cur.style.setProperty("--ry",(x*8).toFixed(2)+"deg");cur.style.setProperty("--rx",(-y*8).toFixed(2)+"deg")}
  if(bg){bg.style.setProperty("--px",(e.clientX/innerWidth-.5).toFixed(3));bg.style.setProperty("--py",(e.clientY/innerHeight-.5).toFixed(3))}})}
},{passive:true});
R.addEventListener("mouseleave",()=>{if(cur){rst(cur);cur=null}});
})();

<script id="wd-js">
/* World Language Dictionary — free no-key APIs: MyMemory (translation, language detection), dictionaryapi.dev (English entries, IPA, recordings). No private keys in this file. */
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const L=[["en","English","EN","#3b82f6","en-US"],["ur","Urdu","UR","#10b981","ur-PK"],["ps","Pashto","PS","#f59e0b","ps-AF"],["ar","Arabic","AR","#14b8a6","ar-SA"],["hi","Hindi","HI","#f97316","hi-IN"],["bn","Bengali","BN","#22c55e","bn-BD"],["fa","Persian","FA","#a855f7","fa-IR"],["es","Spanish","ES","#ef4444","es-ES"],["fr","French","FR","#6366f1","fr-FR"],["de","German","DE","#ca8a04","de-DE"],["it","Italian","IT","#16a34a","it-IT"],["pt","Portuguese","PT","#0ea5e9","pt-PT"],["ru","Russian","RU","#8b5cf6","ru-RU"],["tr","Turkish","TR","#e11d48","tr-TR"],["zh-CN","Chinese","ZH","#dc2626","zh-CN"],["ja","Japanese","JA","#ec4899","ja-JP"],["ko","Korean","KO","#0891b2","ko-KR"],["id","Indonesian","ID","#f43f5e","id-ID"],["nl","Dutch","NL","#ea580c","nl-NL"],["pl","Polish","PL","#65a30d","pl-PL"],["th","Thai","TH","#0d9488","th-TH"],["vi","Vietnamese","VI","#d97706","vi-VN"]];
const M=Object.fromEntries(L.map(l=>[l[0],l])),RTL=["ur","ps","ar","fa"];
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const S={src:"auto",to:ld("mt_wd_to","ur"),all:false,set:new Set(ld("mt_wd_set",["ur","ps","ar","hi"]))};
const C={};let R=null,V=[],last=null;
const badge=c=>`<span class="wd-b" style="background:${M[c][3]}" aria-hidden="true">${M[c][2]}</span>`;
const dec=t=>{const x=document.createElement("textarea");x.innerHTML=t;return x.value};
const spk=(t,c)=>`<button type="button" class="wd-ib wd-spk" data-a="say" data-t="${h(t)}" data-l="${c}" aria-label="Listen in ${M[c][1]}">🔊</button>`;
const msg=(t,k)=>`<div class="wd-msg ${k||""}" role="alert">${t}</div>`;
const detect=q=>/[ښډړټځڅږڼ]/.test(q)?"ps":/[ٹڈڑںےھ]/.test(q)?"ur":/[\u0600-\u06FF]/.test(q)?"ar":/[\u0900-\u097F]/.test(q)?"hi":/[\u0980-\u09FF]/.test(q)?"bn":/[\u0E00-\u0E7F]/.test(q)?"th":/[\uAC00-\uD7AF]/.test(q)?"ko":/[\u3040-\u30FF]/.test(q)?"ja":/[\u4E00-\u9FFF]/.test(q)?"zh-CN":/[\u0400-\u04FF]/.test(q)?"ru":null;
const fromCode=d=>{if(!d)return null;const b=String(d).toLowerCase().split("-")[0];return M[d]?d:M[b]?b:b==="zh"?"zh-CN":null};

async function tr(q,from,to){const k=from+"|"+to+"|"+q;if(C[k])return C[k];
 const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${to}`);
 if(!r.ok)throw Error("service error "+r.status);const j=await r.json(),t=j.responseData&&j.responseData.translatedText;
 if(+j.responseStatus!==200||!t||/MYMEMORY WARNING|INVALID|PLEASE SELECT/i.test(t))throw Error(+j.responseStatus===429?"daily free limit reached":"no translation available");
 return C[k]={t:dec(t),m:j.responseData.match,d:j.responseData.detectedLanguage}}
async function dict(w){const k="d|"+w.toLowerCase();if(C[k])return C[k];const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
 if(r.status===404)throw Error("none");if(!r.ok)throw Error("service error");return C[k]=await r.json()}

/* ---- audio ---- */
const SS="speechSynthesis"in window,lv=()=>{V=speechSynthesis.getVoices();mark()};
if(SS){speechSynthesis.addEventListener("voiceschanged",lv)}
const voice=c=>{const l=M[c][4].toLowerCase(),b=c.split("-")[0].toLowerCase(),n=v=>v.lang.toLowerCase().replace("_","-");return V.find(v=>n(v)===l)||V.find(v=>n(v).split("-")[0]===b)};
function say(t,c){if(!SS)return toast("Audio is not supported in this browser.");if(!V.length)V=speechSynthesis.getVoices();const v=voice(c);
 if(!v)return toast(`Audio unavailable: no ${M[c][1]} voice is installed in this browser/device.`);
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=+($("#wdRate")||{value:1}).value;u.onerror=e=>{if(e.error!=="canceled"&&e.error!=="interrupted")toast("Audio could not be played.")};last=[t,c];speechSynthesis.speak(u)}
function mark(){document.querySelectorAll("#wd .wd-spk").forEach(b=>{const no=!SS||(V.length&&!voice(b.dataset.l));b.classList.toggle("na",!!no);b.title=no?`Audio unavailable: no ${M[b.dataset.l][1]} voice on this device`:"Listen"})}

/* ---- history / favorites ---- */
const hist=q=>{let a=ld("mt_wd_hist",[]).filter(x=>x!==q);a.unshift(q);sv("mt_wd_hist",a.slice(0,20));lists()};
const isFav=q=>ld("mt_wd_fav",[]).includes(q);
function lists(){const f=(a,e)=>a.length?a.map(w=>`<button type="button" class="wd-c" data-a="go" data-w="${h(w)}">${h(w)}</button>`).join(""):`<span class="wd-note">${e}</span>`;
 const H=$("#wdHist"),F=$("#wdFav");if(H)H.innerHTML=f(ld("mt_wd_hist",[]),"No searches yet.");if(F)F.innerHTML=f(ld("mt_wd_fav",[]),"Tap ☆ on a result to save it here.")}

/* ---- search ---- */
async function search(q){q=q.trim().replace(/\s+/g," ");const out=$("#wdOut");
 if(!q)return out.innerHTML=msg("Please type a word or phrase to search.","warn");
 if(q.length>200)return out.innerHTML=msg("Please keep your text under 200 characters.","warn");
 if(!navigator.onLine)return out.innerHTML=msg("You appear to be offline. Translations and dictionary entries need an internet connection.","err");
 out.innerHTML=`<div class="wd-load">Searching…</div>`;
 let src=S.src,note="Language selected by you";
 if(src==="auto"){src=detect(q);note="Language detected from the writing script";
  if(!src){try{const r=await tr(q,"Autodetect","en");src=fromCode(r.d);note="Language auto-detected"}catch{}
   if(!src){src="en";note="Could not detect the language — assuming English. Pick it manually if wrong."}}}
 const me=R={q,src,note,rows:(S.all?[...S.set]:[S.to]).filter(c=>c!==src).map(c=>({c})),dict:null};
 hist(q);draw();
 const todo=[...me.rows],work=async()=>{for(let r;(r=todo.shift());){try{Object.assign(r,await tr(q,src,r.c))}catch(e){r.err=e.message}if(R===me)rows()}};
 await Promise.all([work(),work(),work(),work(),(async()=>{let en=src==="en"?q:null;if(!en){try{en=(await tr(q,src,"en")).t}catch{}}me.en=en;
  if(en&&!/\s/.test(en)){try{me.dict=await dict(en)}catch(e){me.derr=e.message}}else me.derr=en?"phrase":"noen";if(R===me)drawDict()})()]);
 if(!me.rows.length&&R===me)rows()}
function draw(){const r=R;$("#wdOut").innerHTML=`<article class="wd-card" aria-live="polite"><div class="wd-top"><div><h2 class="wd-word" dir="auto">${h(r.q)}</h2><div class="wd-meta">${badge(r.src)}<b>${M[r.src][1]}</b><small>${h(r.note)}</small></div></div><div class="wd-acts">${spk(r.q,r.src)}<button type="button" class="wd-ib" data-a="fav" aria-label="Favorite" aria-pressed="${isFav(r.q)}">${isFav(r.q)?"★":"☆"}</button><button type="button" class="wd-ib" data-a="copy" aria-label="Copy" title="Copy">⧉</button><button type="button" class="wd-ib" data-a="share" aria-label="Share" title="Share">⤴</button></div></div><h3>Translations</h3><div id="wdRows" class="wd-rows"></div></article><article class="wd-card" id="wdDict"><div class="wd-load">Loading dictionary entry…</div></article>`;rows();mark()}
function rows(){const el=$("#wdRows");if(!el)return;
 el.innerHTML=R.rows.length?R.rows.map(r=>{const n=M[r.c];if(r.err)return `<div class="wd-row">${badge(r.c)}<div><b>${n[1]}</b><span class="wd-q low">Translation unavailable: ${h(r.err)}</span></div></div>`;
  if(!r.t)return `<div class="wd-row">${badge(r.c)}<div><b>${n[1]}</b><span class="wd-q">Translating…</span></div></div>`;
  const lo=r.m!=null&&r.m<.5;return `<div class="wd-row">${badge(r.c)}<div><b>${n[1]}</b><span class="wd-t" dir="${RTL.includes(r.c)?"rtl":"ltr"}" lang="${r.c}">${h(r.t)}</span>${r.m!=null?`<span class="wd-q ${lo?"low":""}">Match ${Math.round(r.m*100)}%${lo?" — low confidence, please double-check":""}</span>`:""}</div>${spk(r.t,r.c)}</div>`}).join(""):msg("Choose a target language different from the input language.","warn");mark()}
function drawDict(){const r=R,el=$("#wdDict");if(!el)return;
 if(!r.dict){el.innerHTML=`<h3>Dictionary</h3><p class="wd-note">${r.derr==="phrase"?"Detailed entries are shown for single words; the translations above cover your full phrase.":r.derr==="noen"?"The English equivalent could not be fetched, so no dictionary entry is shown.":r.derr==="none"?`No dictionary entry was found for “${h(r.en)}”.`:"The dictionary service is unavailable right now. Translations above are still shown."}</p>`;return}
 const E=r.dict,P=E.flatMap(e=>e.phonetics||[]),ipa=E[0].phonetic||(P.find(p=>p.text)||{}).text,au=P.find(p=>p.audio),by={};
 E.forEach(e=>(e.meanings||[]).forEach(m=>(by[m.partOfSpeech]=by[m.partOfSpeech]||[]).push(m)));
 const to=[S.to,...S.set].find(c=>c!=="en")||"ur";
 el.innerHTML=`<h3>Dictionary${r.src!=="en"?` <small>for the English equivalent “${h(r.en)}”</small>`:""}</h3><div class="wd-ipa"><b dir="ltr">${ipa?"IPA "+h(ipa):"IPA not available"}</b>${spk(E[0].word,"en")}${au?`<button type="button" class="wd-btn s" data-a="nat" data-u="${h(au.audio)}">▶ Native recording</button>`:""}</div>`+
 Object.entries(by).map(([p,ms])=>{const d=ms.flatMap(m=>m.definitions||[]).slice(0,3),sy=[...new Set(ms.flatMap(m=>[...(m.synonyms||[]),...(m.definitions||[]).flatMap(x=>x.synonyms||[])]))].slice(0,8),an=[...new Set(ms.flatMap(m=>[...(m.antonyms||[]),...(m.definitions||[]).flatMap(x=>x.antonyms||[])]))].slice(0,8),cl=(a,t)=>a.length?`<div class="wd-sy"><b>${t}:</b>${a.map(w=>`<button type="button" data-a="go" data-w="${h(w)}">${h(w)}</button>`).join("")}</div>`:"";
  return `<div class="wd-pos"><span class="wd-chip">${h(p)}</span>${d.map(x=>`<p>${h(x.definition)}</p>${x.example?`<p class="wd-ex">“${h(x.example)}” ${spk(x.example,"en")}<button type="button" class="wd-btn s" data-a="ex" data-t="${h(x.example)}" data-l="${to}">Translate to ${M[to][1]}</button><span class="wd-exo" dir="auto"></span></p>`:""}`).join("")}${cl(sy,"Synonyms")}${cl(an,"Antonyms")}</div>`}).join("")+`<p class="wd-note" style="font-size:12px;margin-top:14px">Dictionary data: dictionaryapi.dev. Translations: MyMemory (machine/community translation — verify important words).</p>`;mark()}

const txt=()=>R?`${R.q} (${M[R.src][1]})\n`+R.rows.filter(r=>r.t).map(r=>`${M[r.c][1]}: ${r.t}`).join("\n")+"\n— Mohsin Tools · World Language Dictionary":"";
async function act(b){const a=b.dataset.a;
 if(a==="say")say(b.dataset.t,b.dataset.l);
 else if(a==="nat"){const u=b.dataset.u.startsWith("//")?"https:"+b.dataset.u:b.dataset.u;new Audio(u).play().catch(()=>toast("The recording could not be played."))}
 else if(a==="go"){$("#wdQ").value=b.dataset.w;search(b.dataset.w)}
 else if(a==="fav"&&R){let f=ld("mt_wd_fav",[]);f=f.includes(R.q)?f.filter(x=>x!==R.q):[R.q,...f];sv("mt_wd_fav",f.slice(0,50));b.textContent=isFav(R.q)?"★":"☆";b.setAttribute("aria-pressed",isFav(R.q));lists()}
 else if(a==="copy"){try{await navigator.clipboard.writeText(txt());toast("Copied")}catch{toast("Copy is not allowed by this browser.")}}
 else if(a==="share"){const t=txt();try{if(navigator.share)await navigator.share({title:"Mohsin Tools Dictionary",text:t});else{await navigator.clipboard.writeText(t);toast("Sharing isn't supported here — copied instead")}}catch(e){if(e.name!=="AbortError")toast("Could not share.")}}
 else if(a==="ex"){const o=b.parentNode.querySelector(".wd-exo");o.textContent="Translating…";try{const r=await tr(b.dataset.t,"en",b.dataset.l);o.innerHTML=`<span lang="${b.dataset.l}" dir="${RTL.includes(b.dataset.l)?"rtl":"ltr"}">${h(r.t)}</span> ${spk(r.t,b.dataset.l)}`;mark()}catch(e){o.textContent="Translation unavailable: "+e.message}}
 else if(a==="clrh"){sv("mt_wd_hist",[]);lists()}else if(a==="clrf"){sv("mt_wd_fav",[]);lists()}
 else if(a==="pause"){speechSynthesis.speaking&&(speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause())}
 else if(a==="stop")SS&&speechSynthesis.cancel();
 else if(a==="replay"&&last)say(...last);
 else if(a==="mode"){S.all=!S.all;b.setAttribute("aria-pressed",S.all);$("#wdChips").hidden=!S.all;$("#wdTo").disabled=S.all}
 else if(a==="chip"){const c=b.dataset.l;S.set.has(c)?S.set.delete(c):S.set.add(c);b.setAttribute("aria-pressed",S.set.has(c));sv("mt_wd_set",[...S.set])}
 else if(a==="theme"){const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("mt_theme",t)}catch{}}}

const opt=(c,s)=>`<option value="${c}"${c===s?" selected":""}>${M[c]?M[c][1]:"Auto-detect"}</option>`;
const page=()=>`<div id="wd"><section class="wd-hero"><h1>Every Word, Every Language</h1><p>Learn Meanings • Listen to Pronunciation • Speak with Confidence</p></section>
<section class="wd-box"><form id="wdForm" class="wd-sr" role="search"><input id="wdQ" type="search" placeholder="Type a word or phrase…" aria-label="Word or phrase" maxlength="200" autocomplete="off"><button class="wd-btn" type="submit">Search</button></form>
<div class="wd-ctl"><label>From<select id="wdSrc"><option value="auto">Auto-detect</option>${L.map(l=>opt(l[0])).join("")}</select></label><label>To<select id="wdTo">${L.map(l=>opt(l[0],S.to)).join("")}</select></label><button type="button" class="wd-btn s" data-a="mode" aria-pressed="false">🌐 Translate All</button></div>
<div id="wdChips" class="wd-chips" hidden role="group" aria-label="Languages for Translate All">${L.map(l=>`<button type="button" class="wd-c" data-a="chip" data-l="${l[0]}" aria-pressed="${S.set.has(l[0])}">${badge(l[0])}${l[1]}</button>`).join("")}</div>
<div class="wd-ctl"><label>Speech speed<select id="wdRate"><option value=".6">Slow</option><option value=".8">Relaxed</option><option value="1" selected>Normal</option><option value="1.25">Fast</option></select></label><button type="button" class="wd-btn s" data-a="replay">↻ Replay</button><button type="button" class="wd-btn s" data-a="pause">⏯ Pause / Resume</button><button type="button" class="wd-btn s" data-a="stop">⏹ Stop</button><button type="button" class="wd-btn s" data-a="theme">◐ Dark / Light</button></div>
${SS?"":msg("This browser does not support speech synthesis, so audio is unavailable.","warn")}</section>
<div id="wdOut"></div>
<section class="wd-box"><h3 style="margin-top:0">Search history <button type="button" class="wd-btn s" data-a="clrh" style="padding:2px 10px;font-size:12px">Clear</button></h3><div id="wdHist" class="wd-chips" style="margin:0"></div><h3>Favorites ★ <button type="button" class="wd-btn s" data-a="clrf" style="padding:2px 10px;font-size:12px">Clear</button></h3><div id="wdFav" class="wd-chips" style="margin:0"></div></section></div>`;
function init(){const w=$("#wd");if(!w)return;R=null;if(SS&&!V.length)lv();lists();
 $("#wdForm").onsubmit=e=>{e.preventDefault();search($("#wdQ").value)};
 $("#wdSrc").onchange=e=>S.src=e.target.value;$("#wdTo").onchange=e=>{S.to=e.target.value;sv("mt_wd_to",S.to)};
 w.onclick=e=>{const b=e.target.closest("[data-a]");if(b)act(b)}}

tools.push({id:"dictionary",name:"World Language Dictionary",icon:"🌍",cat:"Language",desc:"Meanings, translations in 20+ languages, IPA and spoken pronunciation for any word."});
const sp=window.simplePage;window.simplePage=function(p){return p==="dictionary"?page():sp.apply(this,arguments)};
const rd=window.render;window.render=function(p){rd.apply(this,arguments);if(p==="dictionary")init()};
})();
</script>
<script id="tc-js">
(()=>{
/* ---- core builders (no libraries): ZIP, PDF, DOCX ---- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CT[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files,type){const en=new TextEncoder(),ch=[],cd=[];let o=0;
 files.forEach(f=>{const nm=en.encode(f.n),c=crc32(f.d),n=f.d.length,l=new Uint8Array(30+nm.length),v=new DataView(l.buffer);

 const n=scope().length;$("#dmAll").textContent=`⬇ Download All DMCs as One PDF (${n} student${n===1?"":"s"})`;$("#dmDir").textContent=F.dir>0?"▲":"▼"}
function updRow(id){const s=D.stu.find(x=>x.id==id),tr=document.querySelector(`#dmT tr[data-id="${id}"]`);if(!s||!tr)return;const r=calc(s),t=document.createElement("tbody");t.innerHTML=`<tr>${cells(r)}</tr>`;const old=tr.querySelectorAll(".c-t,.c-p,.c-g,.c-r"),nw=t.firstChild.children;old.forEach((o,i)=>o.replaceWith(nw[0]))}
function showErr(a){const e=$("#dmErr");if(!e)return!!a.length;e.hidden=!a.length;e.innerHTML=a.length?"<b>Please fix the following:</b><ul>"+a.slice(0,8).map(x=>`<li>${h(x)}</li>`).join("")+(a.length>8?`<li>…and ${a.length-8} more</li>`:"")+"</ul>":"";if(a.length)e.scrollIntoView({block:"nearest"});return!!a.length}
const msg=(t,k)=>{const m=$("#dmMsg");m.hidden=!t;m.className="dm-msg "+(k||"");m.innerHTML=t};
const lock=b=>document.querySelectorAll("#dm [data-a=all],#dm [data-a=printall],#dm [data-a=pdf]").forEach(x=>x.disabled=b);
/* preview + student form (overlay) */
function overlay(html){const o=$("#dmOv");o.innerHTML=html;o.hidden=false;document.body.style.overflow="hidden";const f=o.querySelector("button,input");f&&f.focus()}
function closeOv(){const o=$("#dmOv");if(o){o.hidden=true;o.innerHTML=""}document.body.style.overflow="";PV=null}
function preview(i){const s=PV.ids[i];PV.i=i;const st=D.stu.find(x=>x.id==s),e=stuErr(st);overlay(`<div class="dm-dlg" role="dialog" aria-modal="true" aria-label="DMC preview"><div class="dm-dh"><b>Preview — ${h(st.name)} (${PV.i+1} / ${PV.ids.length})</b><button type="button" class="dm-b s" data-a="close">✕ Close</button></div><div class="dm-pv" id="dmPvBox">${e.length?`<p class="dm-msg err">${h(e[0])}</p>`:""}</div><div class="dm-row wrap"><button type="button" class="dm-b s" data-a="pvp" ${PV.i?"":"disabled"}>‹ Previous</button><button type="button" class="dm-b s" data-a="pvn" ${PV.i<PV.ids.length-1?"":"disabled"}>Next ›</button><button type="button" class="dm-b s" data-a="pvprint">🖨 Print DMC</button><button type="button" class="dm-b p" data-a="pvpdf">⬇ Download PDF</button></div></div>`);
 if(!e.length){const cv=drawDMC(st);cv.setAttribute("role","img");cv.setAttribute("aria-label","DMC preview");$("#dmPvBox").appendChild(cv)}}
function form(id){const s=id?D.stu.find(x=>x.id==id):{name:"",father:"",roll:"",reg:"",cls:F.cls?F.cls.split("|")[0]:"",sec:F.cls?F.cls.split("|")[1]:"",marks:D.subs.map(()=>"")};
 const t=(l,k,x="")=>`<label class="dm-f">${l}<input data-f="${k}" value="${h(s[k])}" ${x}></label>`;
 overlay(`<div class="dm-dlg" role="dialog" aria-modal="true" aria-label="${id?"Edit":"Add"} student"><div class="dm-dh"><b>${id?"Edit":"Add"} student</b><button type="button" class="dm-b s" data-a="close">✕ Close</button></div><div class="dm-grid">${t("Student name *","name")}${t("Father's name","father")}${t("Roll number *","roll")}${t("Registration number","reg")}${t("Class","cls")}${t("Section","sec")}</div><h4>Marks</h4><div class="dm-grid sm">${D.subs.map((u,i)=>`<label class="dm-f">${h(u.n)} <small>(max ${f(u.m)})</small><input type="number" min="0" max="${u.m}" step="any" data-fm="${i}" value="${h(s.marks[i])}"></label>`).join("")}</div><div id="dmFe" class="dm-msg err" role="alert" hidden></div><div class="dm-row"><button type="button" class="dm-b p" data-a="savef" data-id="${id||""}">Save student</button><button type="button" class="dm-b s" data-a="close">Cancel</button></div></div>`)}
function saveForm(id){const o=$("#dmOv"),v=k=>o.querySelector(`[data-f=${k}]`).value.trim(),s={name:v("name"),father:v("father"),roll:v("roll"),reg:v("reg"),cls:v("cls"),sec:v("sec"),marks:D.subs.map((u,i)=>{const x=o.querySelector(`[data-fm="${i}"]`).value.trim();return x})},e=[];
 if(!s.name)e.push("Student name is required.");if(!s.roll)e.push("Roll number is required.");
 if(s.roll&&D.stu.some(x=>x.id!=id&&key(x)===key(s)&&String(x.roll)===s.roll))e.push(`Roll number ${s.roll} already exists in ${clsLabel(s)}.`);
 e.push(...stuErr(s));const fe=$("#dmFe");if(e.length){fe.hidden=false;fe.innerHTML=e.slice(0,6).map(h).join("<br>");return}
 s.marks=s.marks.map(Number);if(id)Object.assign(D.stu.find(x=>x.id==id),s);else D.stu.push({id:Date.now(),...s});save();closeOv();table();toast(id?"Student updated":"Student added")}
const pick=id=>D.stu.find(x=>x.id==id);
const cname=()=>F.cls?safe(clsLabel(D.stu.find(s=>key(s)===F.cls)||{cls:"",sec:""})):"All-classes";
async function logo(file){if(!/^image\/(jpeg|png)$/.test(file.type)){toast("Please choose a JPG or PNG logo.");return}if(file.size>8e6){toast("The logo must be under 8 MB.");return}
 const u=URL.createObjectURL(file),i=new Image();i.onerror=()=>{URL.revokeObjectURL(u);toast("That image could not be read.")};i.onload=()=>{const k=Math.min(1,300/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);D.set.logo=c.toDataURL("image/png");save();setLogo();toast("Logo added")};i.src=u}
function act(b){const a=b.dataset.a,id=b.dataset.id,i=+b.dataset.i;
 if(a==="add")form();else if(a==="edit")form(id);else if(a==="savef")saveForm(id);else if(a==="close")closeOv();
 else if(a==="del"){const s=pick(id);if(s&&confirm(`Delete ${s.name}?`)){D.stu=D.stu.filter(x=>x.id!=id);save();table()}}
 else if(a==="pv"){PV={ids:view().map(x=>x.id)};preview(PV.ids.indexOf(pick(id).id))}
 else if(a==="pvp")preview(PV.i-1);else if(a==="pvn")preview(PV.i+1);
 else if(a==="pdf"||a==="pvpdf"){const s=pick(a==="pdf"?id:PV.ids[PV.i]);makePdf([s],`DMC-${safe(s.roll)}-${safe(s.name)}.pdf`)}
 else if(a==="pvprint")printList([pick(PV.ids[PV.i])]);
 else if(a==="all"){const l=scope();makePdf(l,`DMC-${cname()}-${l.length}-students.pdf`)}else if(a==="printall")printList(scope());
 else if(a==="chip"){F.cls=b.dataset.k;table()}else if(a==="dir"){F.dir*=-1;table()}
 else if(a==="imp")$("#dmCsv").click();else if(a==="logo")$("#dmLogo").click();else if(a==="nologo"){D.set.logo="";save();setLogo();toast("Logo removed")}
 else if(a==="samplecsv"){const t=D.stu;D.stu=SAMPLE();const x=toCsv();D.stu=t;dl(new Blob([x],{type:"text/csv"}),"dmc-sample-students.csv")}
 else if(a==="expcsv"){if(!D.stu.length)return msg("There are no students to export.","err");dl(new Blob([toCsv()],{type:"text/csv"}),"dmc-students.csv")}
 else if(a==="sample"){if(D.stu.length&&!confirm("Replace the current students with the sample students?"))return;D.subs=SUBS();D.stu=SAMPLE();save();subsUi();table();msg("Sample students loaded.","ok")}
 else if(a==="clear"){if(D.stu.length&&confirm("Delete all students? This cannot be undone.")){D.stu=[];F.cls="";save();table()}}
 else if(a==="addsub"){if(D.subs.length>=12)return toast("A DMC can have at most 12 subjects.");D.subs.push({n:"New Subject",m:100});D.stu.forEach(s=>s.marks.push(0));save();subsUi();table()}
 else if(a==="rmsub"){if(D.subs.length<2)return toast("At least one subject is required.");if(!confirm(`Remove "${D.subs[i].n}" and its marks?`))return;D.subs.splice(i,1);D.stu.forEach(s=>s.marks.splice(i,1));save();subsUi();table()}
 else if(a==="addgr"){D.grades.push({g:"New",min:0});save();grUi()}else if(a==="rmgr"){if(D.grades.length<2)return toast("At least one grade is required.");D.grades.splice(i,1);save();grUi();table()}else if(a==="resetgr"){D.grades=GR();save();grUi();table()}}
function change(e){const x=e.target;
 if(x.dataset.set!=null){D.set[x.dataset.set]=x.value;if(x.dataset.set==="school"&&!x.value.trim())toast("School name cannot be empty.");save()}
 else if(x.id==="dmLogo"){const f=x.files[0];x.value="";f&&logo(f)}
 else if(x.id==="dmCsv"){const f=x.files[0];x.value="";if(!f)return;if(f.size>3e6)return msg("That file is too large (max 3 MB).","err");f.text().then(t=>{try{const r=importCsv(t);subsUi();table();msg(`Imported <b>${r.add}</b> student${r.add>1?"s":""}.${r.errs.length?` <b>${r.errs.length}</b> row(s) skipped:<ul>${r.errs.slice(0,6).map(m=>`<li>${h(m)}</li>`).join("")}</ul>`:""}`,r.errs.length?"warn":"ok")}catch(er){msg(h(er.message),"err")}})}
 else if(x.dataset.p){if(x.type==="checkbox")D.reqSub=x.checked;else{const v=+x.value;if(x.value===""||isNaN(v)||v<0||v>100){toast("Passing percentage must be between 0 and 100.");x.value=D[x.dataset.p];return}D[x.dataset.p]=v}save();table()}
 else if(x.dataset.sn!=null){const v=x.value.trim();if(!v){toast("Subject name cannot be empty.");x.value=D.subs[x.dataset.sn].n;return}D.subs[x.dataset.sn].n=v;save();table()}
 else if(x.dataset.sm!=null){const v=+x.value,i=+x.dataset.sm;if(!(v>0)){toast("Total marks must be greater than 0.");x.value=D.subs[i].m;return}const over=D.stu.filter(s=>+s.marks[i]>v);D.subs[i].m=v;save();table();if(over.length)msg(`Some students now have more than ${v} marks in ${h(D.subs[i].n)} (shown in red): ${over.slice(0,4).map(s=>h(s.name)).join(", ")}. Fix them before downloading.`,"warn")}
 else if(x.dataset.gn!=null){const v=x.value.trim();if(!v){toast("Grade name cannot be empty.");x.value=D.grades[x.dataset.gn].g;return}D.grades[x.dataset.gn].g=v;save();table()}
 else if(x.dataset.gm!=null){const v=+x.value;if(x.value===""||isNaN(v)||v<0||v>100){toast("Grade boundary must be between 0 and 100.");x.value=D.grades[x.dataset.gm].min;return}D.grades[x.dataset.gm].min=v;save();table()}
 else if(x.classList.contains("dm-in")){const s=pick(x.dataset.id),i=+x.dataset.i,u=D.subs[i],v=x.value.trim();
  if(v===""||isNaN(+v)||+v<0||+v>u.m){toast(`${u.n}: marks must be a number from 0 to ${u.m}.`);x.classList.add("bad");x.value=s.marks[i];x.classList.toggle("bad",+s.marks[i]>u.m);return}
  s.marks[i]=+v;x.classList.remove("bad");save();updRow(s.id)}
 else if(x.id==="dmSort"){F.sort=x.value;table()}else if(x.id==="dmGrp"){F.group=x.checked;table()}}
function init(){const r=$("#dm");if(!r)return;F={q:"",cls:"",sort:"roll",dir:1,group:true};r.querySelectorAll("[data-set=lang]").forEach(s=>s.value=D.set.lang);subsUi();grUi();table();
 r.onclick=e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)act(b);else if(e.target.id==="dmOv")closeOv()};r.onchange=change;
 r.oninput=e=>{if(e.target.id==="dmQ"){F.q=e.target.value;table()}};
 r.onkeydown=e=>{if(e.key==="Escape"&&!$("#dmOv").hidden)closeOv()}}
tools.push({id:"dmc",name:"DMC Generator",icon:"📄",cat:"Academic",desc:"Detailed Marks Certificates for a whole class: add or import students, preview, and download all DMCs in one PDF."});
const sp=window.simplePage;window.simplePage=function(p){return p==="dmc"?page():sp.apply(this,arguments)};
const rd=window.render;window.render=function(p){rd.apply(this,arguments);if(p==="dmc")init()};
})();
</script>
