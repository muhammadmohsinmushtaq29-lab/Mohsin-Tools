.certwrap{container-type:inline-size;max-width:900px;margin:auto}.certwrap.port{max-width:620px}
.cert{position:relative;overflow:hidden;box-sizing:border-box;width:100%;font-size:1cqw;--ink:#17243d;--mut:#55627a;--on:#fff;color:var(--ink);background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert.land{aspect-ratio:297/210}.cert.port{aspect-ratio:210/297;font-size:1.45cqw}
.cert.f-serif{font-family:Georgia,"Times New Roman",serif}.cert.f-sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
.cert .cd{position:absolute;display:none}.cert::before,.cert::after{content:"";position:absolute;pointer-events:none;display:none}
.cert-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:5em 8em 4.5em}
.cert-head{display:grid;grid-template-columns:15em 1fr 15em;align-items:center;gap:2em;width:100%}.cert-hl{justify-self:start;min-height:1px}.cert-hr{justify-self:end;min-height:1px}
.cert-logo{height:11em;max-width:15em;object-fit:contain;display:block}
.cert-photo{width:12em;height:14.5em;object-fit:cover;display:block;border:.45em solid #fff;box-shadow:0 0 0 .2em var(--cc),0 .6em 1.6em #0003}.cert-photo.round{width:13em;height:13em;border-radius:50%}
.cert-school{font-size:2.7em;font-weight:700;color:var(--cc);letter-spacing:.08em;text-transform:uppercase;line-height:1.25;overflow-wrap:anywhere}
.cert-mid{display:flex;flex-direction:column;align-items:center;gap:.9em}
.cert-title{font-size:6.6em;font-weight:800;letter-spacing:.28em;color:var(--cc);line-height:1;margin-right:-.28em}
.cert-of{font-size:2.2em;letter-spacing:.5em;color:var(--mut);margin-right:-.5em}
.cert-pre{font-size:1.9em;font-style:italic;color:var(--mut);margin-top:.5em}
.cert-name{--nfn:4.6;font-size:calc(var(--nfn)*1em);border-bottom:calc(.55em/var(--nfn)) solid var(--c2);padding:0 calc(2em/var(--nfn)) calc(.2em/var(--nfn));min-width:calc(34em/var(--nfn));line-height:1.3;overflow-wrap:anywhere}
.ns-script .cert-name{font-family:"Segoe Script","Brush Script MT","Lucida Handwriting","Apple Chancery",cursive;--nfn:4.6}
.ns-italic .cert-name{font-family:Georgia,"Times New Roman",serif;font-style:italic;--nfn:5}
.ns-bold .cert-name{font-family:Inter,"Segoe UI",Arial,sans-serif;font-weight:800;--nfn:4;text-transform:uppercase;letter-spacing:.05em}
.cert-text{font-size:2em;max-width:68em;line-height:1.55;color:var(--mut);overflow-wrap:anywhere}
.cert-high{margin-top:.3em;padding:.45em 1.6em;border-radius:3em;background:var(--cc);color:var(--on);font-weight:700;font-size:2em}
.cert-meta{font-size:1.6em;color:var(--mut)}
.cert-foot{display:grid;grid-template-columns:1fr 10em 1fr;gap:5em;width:100%;align-items:end}
.sg span{display:block;border-bottom:.15em solid var(--ink);height:3.2em}.sg small{display:block;font-size:1.7em;color:var(--mut);margin-top:.4em}
.cert-seal{font-size:4em;width:2.4em;height:2.4em;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--c2),var(--cc));box-shadow:0 0 0 .1em #fff,0 0 0 .18em var(--c2);display:grid;place-items:center;color:#fff;line-height:1;margin:0 auto}
/* Modern Blue */
.t-modern .cd{display:block}.t-modern .cd1{top:0;left:0;width:13em;height:13em;background:linear-gradient(135deg,var(--cc),var(--c2));clip-path:polygon(0 0,100% 0,0 100%)}
.t-modern .cd2{right:0;bottom:0;width:13em;height:13em;background:linear-gradient(135deg,var(--c2),var(--cc));clip-path:polygon(100% 0,100% 100%,0 100%)}
.t-modern::after{display:block;inset:2em;border:.18em solid #dbe5f3}
/* Classic Gold */
.t-gold{background:#fffdf5}.t-gold::before{display:block;inset:1.6em;border:.55em double var(--c2)}.t-gold::after{display:block;inset:3.6em;border:.14em solid var(--cc)}.t-gold .cert-in{padding:6.5em 9em 6em}.t-gold .cert-title{color:var(--cc)}
/* Royal Dark */
.t-dark{--ink:#f4f7ff;--mut:#b9c6e0;--on:#10244a;background:linear-gradient(135deg,#0b1830,#13305c)}.t-dark::after{display:block;inset:2.4em;border:.15em solid var(--c2)}.t-dark .cert-photo{border-color:#13305c}
.t-dark .cd{display:block}.t-dark .cd1{top:-22em;right:-22em;width:62em;height:62em;border-radius:50%;background:radial-gradient(circle,#ffffff17,transparent 65%)}
/* Emerald */
.t-green{background:#fbfdfb}.t-green .cd{display:block;top:0;bottom:0;width:6em;background:linear-gradient(180deg,var(--cc),#0a4634)}.t-green .cd1{left:0}.t-green .cd2{right:0}.t-green::after{display:block;inset:2.2em 8em;border:.14em solid #cfe3da}.t-green .cert-in{padding:5em 11em 4.5em}
/* Minimal */
.t-min::after{display:block;inset:2.6em;border:.2em solid var(--ink)}.t-min .cert-title{font-weight:300;letter-spacing:.45em}.t-min .cert-in{padding:6em 9em 5.5em}.t-min .cert-high{background:transparent;color:var(--ink);border:.12em solid var(--ink)}.t-min .cert-seal{background:var(--ink);box-shadow:none}

function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;right:20px;background:#10244a;color:white;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:0 8px 24px #0003";document.body.append(t)}t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2500)}

const MK_KEY="mt_marks";
const MK_CLASSES=["Nursery","KG","Class 1","Class 2","Class 3","Class 4","Class 5","Class 6","Class 7","Class 8","Class 9","Class 10","Class 11","Class 12"];
let mkStore=null,mkCls="Class 8";
function mkRead(){try{const s=JSON.parse(localStorage.getItem(MK_KEY)||"null");if(s&&s.classes&&s.meta)return s}catch{}return {meta:{school:"",exam:"Annual Exam",pass:33,sort:"Position",cls:"Class 8"},classes:{}}}
function mkWrite(){try{mkStore.meta.cls=mkCls;localStorage.setItem(MK_KEY,JSON.stringify(mkStore))}catch{toast("Could not save in this browser")}}
function mkBlank(d){return {r:"",n:"",m:d.subjects.map(()=>"")}}
function mkData(){if(!mkStore.classes[mkCls]){const d={subjects:["Urdu","English","Mathematics","Science","Islamiyat"].map(n=>({n,t:100})),students:[]};for(let i=0;i<5;i++)d.students.push(mkBlank(d));mkStore.classes[mkCls]=d}return mkStore.classes[mkCls]}
function mkGrade(p,pass){return p<pass?"F":p>=80?"A+":p>=70?"A":p>=60?"B":p>=50?"C":p>=40?"D":"E"}
function mkCompute(){
 const d=mkData(),pass=Number(mkStore.meta.pass)||33,grand=d.subjects.reduce((a,s)=>a+(Number(s.t)||0),0);
 const rows=d.students.map((s,i)=>{
  let total=0,fail=false,bad=false,any=false;
  const cells=d.subjects.map((sub,j)=>{const raw=String(s.m[j]??"").trim(),t=Number(sub.t)||0;
   if(raw==="")return {raw,v:0};
   const v=Number(raw);if(!Number.isFinite(v)||v<0||v>t){bad=true;return {raw,v:0,bad:true}}
   any=true;return {raw,v}});
  cells.forEach((x,j)=>{total+=x.v;const t=Number(d.subjects[j].t)||0;if(t>0&&x.v/t*100<pass)fail=true});
  const pct=grand>0?total/grand*100:0,active=!!(s.n.trim()||s.r.trim()||any);
  return {i,s,cells,total,pct,bad,active,grade:mkGrade(pct,pass),result:bad?"Check marks":(fail||pct<pass)?"Fail":"Pass"};
 });
 const act=rows.filter(r=>r.active);
 rows.forEach(r=>{r.pos=r.active?1+act.filter(o=>o.total>r.total).length:""});
 return {d,rows,act,grand,pass};
}

function mkSubjectsHtml(){const d=mkData();return `<div class="table-wrap"><table style="min-width:380px"><thead><tr><th>#</th><th>Subject name</th><th>Total marks</th><th></th></tr></thead><tbody>${d.subjects.map((s,j)=>`<tr><td>${j+1}</td><td><input data-mk="sname" data-i="${j}" aria-label="Subject ${j+1} name" placeholder="Subject" value="${escapeHtml(s.n)}"></td><td><input data-mk="stotal" data-i="${j}" aria-label="Subject ${j+1} total marks" type="number" min="1" value="${escapeHtml(s.t)}" style="max-width:110px"></td><td><button class="btn danger" data-mkdelsub="${j}" aria-label="Remove subject ${j+1}">✕</button></td></tr>`).join("")}</tbody></table></div>`}
function mkSubHead(s,j){return escapeHtml(s.n||("Subject "+(j+1)))+" / "+escapeHtml(s.t)}
function mkTableHtml(){const d=mkData();return `<table class="mk-table"><thead><tr><th>#</th><th>Roll No</th><th>Student name</th><th>Photo</th>${d.subjects.map((s,j)=>`<th><span data-hsub="${j}">${mkSubHead(s,j)}</span></th>`).join("")}<th>Total</th><th>%</th><th>Grade</th><th>Position</th><th></th></tr></thead><tbody>${d.students.map((s,i)=>`<tr><td>${i+1}</td><td><input data-mk="roll" data-i="${i}" aria-label="Roll number ${i+1}" value="${escapeHtml(s.r)}" style="min-width:64px"></td><td><input data-mk="name" data-i="${i}" aria-label="Student name ${i+1}" value="${escapeHtml(s.n)}" style="min-width:160px"></td><td style="white-space:nowrap">${s.p?`<img src="${s.p}" alt="" style="width:26px;height:32px;object-fit:cover;border-radius:4px;vertical-align:middle"> `:""}<label class="btn" style="padding:3px 8px;font-size:12px;cursor:pointer" title="Add photo">📷<input type="file" accept="image/*" data-mkphoto="${i}" hidden></label>${s.p?` <button class="btn danger" style="padding:3px 7px" data-mkrmphoto="${i}" aria-label="Remove photo ${i+1}">✕</button>`:""}</td>${d.subjects.map((_,j)=>`<td><input data-mk="mark" data-i="${i}" data-j="${j}" aria-label="${escapeHtml(d.subjects[j].n||"Subject")} marks, student ${i+1}" inputmode="decimal" value="${escapeHtml(s.m[j]??"")}" style="min-width:58px"></td>`).join("")}<td id="mkT${i}"></td><td id="mkP${i}"></td><td id="mkG${i}"></td><td id="mkR${i}"></td><td><button class="btn danger" data-mkdel="${i}" aria-label="Remove student ${i+1}">✕</button></td></tr>`).join("")}</tbody></table>`}
function mkAwardHtml(c){
 const {d,act,grand,pass}=c,sortRoll=mkStore.meta.sort==="Roll number";
 let list=act.slice();
 const cmpRoll=(a,b)=>String(a.s.r).localeCompare(String(b.s.r),undefined,{numeric:true});
 list.sort(sortRoll?(a,b)=>cmpRoll(a,b)||a.pos-b.pos:(a,b)=>a.pos-b.pos||cmpRoll(a,b));
 const ph=!!mkStore.meta.showPh,head=`<div class="paper-head">${mkStore.meta.logo?`<img class="aw-logo" alt="Logo" src="${mkStore.meta.logo}">`:""}<h2 style="margin:0">${escapeHtml(mkStore.meta.school||"School / Institution")}</h2><h3 style="margin:4px 0">AWARD LIST</h3><p style="margin:0">${escapeHtml(mkStore.meta.exam||"Exam")} · ${escapeHtml(mkCls)} · Total marks: ${grand} · Pass mark: ${pass}%</p></div>`;
 if(!list.length)return head+`<div class="empty">Add students and marks above — the Award List appears here.</div>`;
 const pass_n=list.filter(r=>r.result==="Pass").length;
 return `${head}<div class="table-wrap"><table class="award-table"><thead><tr><th>Position</th><th>Roll No</th><th>Student name</th>${ph?"<th>Photo</th>":""}${d.subjects.map((s,j)=>`<th>${mkSubHead(s,j)}</th>`).join("")}<th>Total / ${grand}</th><th>%</th><th>Grade</th><th>Result</th></tr></thead><tbody>${list.map(r=>`<tr><td><b>${r.pos}</b></td><td>${escapeHtml(r.s.r)}</td><td style="text-align:left">${escapeHtml(r.s.n)}</td>${ph?`<td>${r.s.p?`<img src="${r.s.p}" alt="" style="width:30px;height:38px;object-fit:cover;border-radius:3px;vertical-align:middle">`:""}</td>`:""}${r.cells.map(x=>`<td>${x.bad?"?":escapeHtml(x.raw===""?"—":x.raw)}</td>`).join("")}<td><b>${+r.total.toFixed(2)}</b></td><td>${r.pct.toFixed(1)}</td><td>${r.grade}</td><td>${r.result}</td></tr>`).join("")}</tbody></table></div><p style="margin:10px 0 0;font-size:12px">Students: ${list.length} · Passed: ${pass_n} · Failed / to check: ${list.length-pass_n} · Date: ${new Date().toLocaleDateString()}</p><div class="award-sign"><span>Class Teacher</span><span>Examination In-charge</span><span>Principal</span></div>`;
}
function mkRefresh(){
 if(!$("#mkTable"))return;
 const c=mkCompute();let badCount=0;
 c.rows.forEach(r=>{
  const set=(id,v)=>{const el=$("#"+id+r.i);if(el)el.textContent=v};
  set("mkT",r.active?+r.total.toFixed(2):"");set("mkP",r.active?r.pct.toFixed(1):"");set("mkG",r.active?r.grade:"");set("mkR",r.pos===""?"":r.pos);
  if(r.bad)badCount++;
  r.cells.forEach((x,j)=>{const el=$(`input[data-mk="mark"][data-i="${r.i}"][data-j="${j}"]`);if(el){el.style.borderColor=x.bad?"#c53b4c":"";el.title=x.bad?`Enter a number from 0 to ${c.d.subjects[j].t}`:""}});
 });
 $("#mkWarn").innerHTML=badCount?`<div class="notice" style="background:#fde8ea;color:#8f2433">Some marks are invalid (not a number, negative, or above the subject total). They are counted as 0 and marked “?” until fixed.</div>`:"";
 $("#mkAward").innerHTML=mkAwardHtml(c);
 const pn=$("#printName");if(pn)pn.textContent=mkStore.meta.myname??"Mohsin";
}
function mkRenderAll(){if(!$("#mkTable"))return;mkLogoBox();$("#mkSubjects").innerHTML=mkSubjectsHtml();$("#mkTable").innerHTML=mkTableHtml();mkRefresh()}

 else if(el.dataset.mkdelsub!==undefined){const j=Number(el.dataset.mkdelsub);if(d.subjects.length<2){toast("Keep at least one subject");return}if(!confirm(`Remove subject "${d.subjects[j].n||j+1}" and its marks?`))return;d.subjects.splice(j,1);d.students.forEach(s=>s.m.splice(j,1));mkWrite();mkRenderAll()}
 else if(el.id==="mkAddStudent"||el.id==="mkAdd5"){const n=el.id==="mkAdd5"?5:1;for(let x=0;x<n;x++)d.students.push(mkBlank(d));mkWrite();mkRenderAll();if(n===1){const ins=$$('input[data-mk="roll"]');ins[ins.length-1]?.focus()}}

 else if(el.id==="mkAwardPrint"){let st=$("#mkPageStyle");if(!st){st=document.createElement("style");st.id="mkPageStyle";document.head.append(st)}st.textContent="@media print{@page{size:A4 landscape;margin:0}}";window.print()}
});

/* ===== Quiz & MCQ Builder ===== */
let qz={school:"",title:"",cls:"",time:"",qs:[]},qzShowKey=false,qzPractice=false,qzAns=[],qzChecked=false;
const QZL=["A","B","C","D"];
function qzBlank(){return {q:"",o:["","","",""],a:0}}
function qzLoad(){qz={school:"",title:"",cls:"",time:"",qs:[qzBlank(),qzBlank(),qzBlank()]};try{const s=JSON.parse(localStorage.getItem("mt_quiz")||"null");if(s&&Array.isArray(s.qs)&&s.qs.length){qz=Object.assign(qz,s);qz.qs=qz.qs.map(x=>({q:String(x.q||""),o:[0,1,2,3].map(j=>String((x.o||[])[j]||"")),a:[0,1,2,3].includes(x.a)?x.a:0}))}}catch{}qzShowKey=false;qzPractice=false;qzAns=[];qzChecked=false}
function qzSave(){try{localStorage.setItem("mt_quiz",JSON.stringify(qz))}catch{}}
function quizPage(){qzLoad();return `${pageHead("Quiz & MCQ Builder","Type your own multiple-choice questions, print the paper with an answer key, or practise on screen.")}
<div class="two-col"><section class="panel no-print"><div class="form-grid">
<div class="field"><label for="qzSchool">School / institution</label><input id="qzSchool" data-qz="school" placeholder="School name" value="${escapeHtml(qz.school)}"></div>
<div class="field"><label for="qzTitle">Test title</label><input id="qzTitle" data-qz="title" placeholder="e.g. Science MCQ Test" value="${escapeHtml(qz.title)}"></div>
<div class="field"><label for="qzCls">Class</label><input id="qzCls" data-qz="cls" placeholder="e.g. Class 8" value="${escapeHtml(qz.cls)}"></div>
<div class="field"><label for="qzTime">Time allowed</label><input id="qzTime" data-qz="time" placeholder="e.g. 20 minutes" value="${escapeHtml(qz.time)}"></div></div>
<div id="qzList"></div>
<div class="actions">${btn("+ Add question",'id="qzAdd"',"primary")}${btn("Save project",'id="qzSaveBtn"')}${btn("Clear all",'id="qzClear"',"danger")}</div></section>
<section class="panel"><div class="no-print" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Paper preview</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label style="font-size:13px"><input type="checkbox" id="qzKey"> Show answer key</label>${btn("Practice on screen",'id="qzPracticeBtn"',"soft")}${btn("Print / Save PDF",'id="printBtn"')}</div></div><div id="qzPreview" class="preview"></div></section></div>`}
function qzListHtml(){return qz.qs.map((x,i)=>`<div class="resource" style="display:block;margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Question ${i+1}</b><button class="btn danger" data-qzdel="${i}" aria-label="Remove question ${i+1}">✕</button></div><div class="field"><textarea data-qz="q" data-i="${i}" aria-label="Question ${i+1}" placeholder="Type the question" style="min-height:60px">${escapeHtml(x.q)}</textarea></div><div class="form-grid" style="margin-top:8px">${QZL.map((L,j)=>`<div class="field"><label>Option ${L}</label><input data-qz="o" data-i="${i}" data-j="${j}" value="${escapeHtml(x.o[j])}"></div>`).join("")}<div class="field"><label>Correct answer</label><select data-qz="a" data-i="${i}">${QZL.map((L,j)=>`<option value="${j}"${x.a===j?" selected":""}>${L}</option>`).join("")}</select></div></div></div>`).join("")}
function qzRender(){
 const el=$("#qzPreview");if(!el)return;
 const list=qz.qs.filter(x=>x.q.trim());
 const head=`<div class="paper-head"><h2 style="margin:0">${escapeHtml(qz.school||"School / Institution")}</h2><h3 style="margin:4px 0">${escapeHtml(qz.title||"MCQ Test")}</h3><p style="margin:0">${qz.cls?"Class: "+escapeHtml(qz.cls)+" · ":""}${qz.time?"Time: "+escapeHtml(qz.time)+" · ":""}Total Marks: ${list.length}</p>${qzPractice?"":`<p style="margin:8px 0 0">Name: ____________________ &nbsp; Roll No: __________ &nbsp; Date: __________</p>`}</div>`;
 if(!list.length){el.innerHTML=head+`<div class="empty">Add at least one question to see the paper.</div>`;return}
 let score=0;
 const body=list.map((x,n)=>{
  const opts=QZL.map((Lt,j)=>({Lt,j,t:x.o[j].trim()})).filter(p=>p.t);
  if(qzPractice){
   if(qzChecked&&qzAns[n]===x.a)score++;
   return `<div class="paper-question" style="break-inside:avoid"><b>${n+1}. ${escapeHtml(x.q)}</b>${opts.map(p=>{const right=qzChecked&&p.j===x.a,wrong=qzChecked&&qzAns[n]===p.j&&p.j!==x.a;return `<label style="display:block;margin:4px 0;${right?"color:#14803c;font-weight:700":""}${wrong?"color:#c53b4c;text-decoration:line-through":""}"><input type="radio" name="qzr${n}" data-qzr="${n}" value="${p.j}"${qzAns[n]===p.j?" checked":""}${qzChecked?" disabled":""}> (${p.Lt}) ${escapeHtml(p.t)}${right?" ✓":""}</label>`}).join("")}</div>`}
  return `<div class="paper-question" style="break-inside:avoid"><b>${n+1}. ${escapeHtml(x.q)}</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;margin-top:6px">${opts.map(p=>`<div>(${p.Lt}) ${escapeHtml(p.t)}</div>`).join("")}</div></div>`}).join("");
 let extra="";
 if(qzPractice)extra=qzChecked?`<div class="result"><strong>${score} / ${list.length}</strong>${Math.round(score/list.length*100)}% correct. Correct answers are in green.</div><div class="actions no-print">${btn("Try again",'id="qzRetry"',"primary")}</div>`:`<div class="actions no-print">${btn("Check answers",'id="qzCheck"',"primary")}</div>`;
 else if(qzShowKey)extra=`<div style="margin-top:18px;border-top:2px solid #263d5e;padding-top:10px;break-inside:avoid"><b>Answer key</b><div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px">${list.map((x,n)=>`<span>${n+1}. ${x.o[x.a].trim()?QZL[x.a]:"?"}</span>`).join("")}</div></div>`;
 el.innerHTML=head+body+extra;
}
document.addEventListener("input",e=>{
 const t=e.target,k=t.dataset&&t.dataset.qz;if(!k||!$("#qzPreview"))return;
 const i=Number(t.dataset.i),j=Number(t.dataset.j);
 if(["school","title","cls","time"].includes(k))qz[k]=t.value;
 else if(k==="q")qz.qs[i].q=t.value;
 else if(k==="o")qz.qs[i].o[j]=t.value;
 qzSave();qzRender();
});
document.addEventListener("change",e=>{
 const t=e.target;if(!$("#qzPreview"))return;
 if(t.dataset&&t.dataset.qz==="a"){qz.qs[Number(t.dataset.i)].a=Number(t.value);qzSave();qzRender()}
 if(t.id==="qzKey"){qzShowKey=t.checked;qzRender()}
 if(t.dataset&&t.dataset.qzr!==undefined){qzAns[Number(t.dataset.qzr)]=Number(t.value)}
});
document.addEventListener("click",e=>{
 if(!$("#qzPreview"))return;
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="qzAdd"){qz.qs.push(qzBlank());qzSave();$("#qzList").innerHTML=qzListHtml();qzRender();const ta=$$('textarea[data-qz="q"]');ta[ta.length-1]?.focus()}
 else if(b.dataset.qzdel!==undefined){const i=Number(b.dataset.qzdel);if(qz.qs[i].q.trim()&&!confirm("Remove this question?"))return;qz.qs.splice(i,1);if(!qz.qs.length)qz.qs.push(qzBlank());qzSave();$("#qzList").innerHTML=qzListHtml();qzRender()}
 else if(b.id==="qzClear"){if(!confirm("Delete all questions?"))return;qz.qs=[qzBlank(),qzBlank(),qzBlank()];qzSave();$("#qzList").innerHTML=qzListHtml();qzRender()}
 else if(b.id==="qzSaveBtn"){qzSave();saveItem("Quiz",qz.title||"MCQ quiz",JSON.parse(JSON.stringify(qz)))}
 else if(b.id==="qzPracticeBtn"){qzPractice=!qzPractice;qzChecked=false;qzAns=[];b.textContent=qzPractice?"Back to paper":"Practice on screen";qzRender()}
 else if(b.id==="qzCheck"){qzChecked=true;qzRender()}
 else if(b.id==="qzRetry"){qzChecked=false;qzAns=[];qzRender()}
});

/* ===== Study Planner ===== */
function spPage(){return `${pageHead("Study Planner","Create a weekly study plan from your subjects and daily study hours, edit any slot, then print it.")}<div class="panel"><div class="form-grid">${field("Student name","spName","Your name")}${field("Goal / exam","spGoal","e.g. Final Exam 2026")}<div class="field full"><label for="spSubjects">Subjects (comma separated)</label><input id="spSubjects" value="Urdu, English, Mathematics, Science, Islamiyat"></div>${field("Study hours per day","spHours","3","number","3")}${selectField("Session length","spLen",["60 minutes","45 minutes","30 minutes"])}${field("Start time","spStart","","time","16:00")}${selectField("Study days","spDays",["Monday–Friday","Monday–Saturday","All 7 days"])}</div><div class="actions no-print">${btn("Create plan",'id="spBuild"',"primary")}${btn("Download CSV",'id="spCsv"')}${btn("Print / Save PDF",'id="printBtn"')}${btn("Save project",'id="spSave"')}</div><div id="spOut" class="table-wrap" style="margin-top:20px"></div></div>`}
function spBuild(){
 const out=$("#spOut");if(!out)return;
 const subs=($("#spSubjects").value||"").split(/[,،]/).map(s=>s.trim()).filter(Boolean),hours=Number($("#spHours").value),len=parseInt($("#spLen").value)||60,st=$("#spStart").value||"16:00";
 if(!subs.length||!(hours>=0.5)||hours>12){out.innerHTML='<div class="notice">Enter at least one subject and study hours between 0.5 and 12.</div>';return}
 const per=Math.min(24,Math.max(1,Math.floor(hours*60/len))),dv=$("#spDays").value;
 const days=["Monday","Tuesday","Wednesday","Thursday","Friday"];if(dv==="Monday–Saturday")days.push("Saturday");if(dv==="All 7 days")days.push("Saturday","Sunday");
 const [h0,m0]=st.split(":").map(Number),fmt=m=>{m=m%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
 const rows=[];for(let s=0;s<per;s++)rows.push({time:`${fmt(h0*60+m0+s*len)}–${fmt(h0*60+m0+(s+1)*len)}`,cells:[]});
 let k=0;days.forEach(()=>rows.forEach(r=>r.cells.push(subs[k++%subs.length])));
 const title=[$("#spName").value.trim(),$("#spGoal").value.trim()].filter(Boolean).join(" · ")||"Weekly study plan";
 out.innerHTML=`<h2>${escapeHtml(title)}</h2><p class="sub" style="margin-bottom:12px">${per} session${per>1?"s":""} of ${len} minutes per day. Subjects rotate so each gets equal time. Click any cell to change it.</p><table id="spTable"><thead><tr><th>Time</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><th>${r.time}</th>${r.cells.map((c,i)=>`<td><input aria-label="${days[i]} ${r.time}" value="${escapeHtml(c)}"></td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function spRows(){const t=$("#spTable");return t?$$("tr",t).map(tr=>$$("th,td",tr).map(c=>c.querySelector("input")?c.querySelector("input").value:c.textContent.trim())):[]}
document.addEventListener("click",e=>{
 if(!$("#spOut"))return;
 if(e.target.id==="spBuild")spBuild();
 if(e.target.id==="spCsv"){if(!$("#spTable"))spBuild();const r=spRows();if(r.length)csvDownload("Mohsin-Tools-Study-Plan.csv",r)}
 if(e.target.id==="spSave"){if(!$("#spTable"))spBuild();saveItem("Study Plan",$("#spGoal").value||$("#spName").value||"Study plan",spRows())}
});

/* ===== Image helper ===== */
function imgShrink(file,max,cb){if(!file)return;if(!file.type.startsWith("image/")){alert("Please choose an image file (JPG, PNG or WebP).");return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",.88))};im.onerror=()=>alert("Could not read this image.");im.src=r.result};r.onerror=()=>alert("Could not read this image.");r.readAsDataURL(file)}
function mkLogoBox(){const b=$("#mkLogoBox");if(!b)return;b.innerHTML=mkStore.meta.logo?`<img src="${mkStore.meta.logo}" alt="Logo" style="height:42px;max-width:120px;object-fit:contain;vertical-align:middle"> <button class="btn danger" id="mkRmLogo" style="padding:4px 9px">Remove logo</button>`:""}
document.addEventListener("change",e=>{
 const t=e.target;if(!$("#mkTable"))return;
 if(t.id==="mkShowPh"){mkStore.meta.showPh=t.checked;mkWrite();mkRefresh()}
 if(t.id==="mkLogo")imgShrink(t.files&&t.files[0],300,u=>{mkStore.meta.logo=u;mkWrite();mkLogoBox();mkRefresh()});
 if(t.dataset&&t.dataset.mkphoto!==undefined)imgShrink(t.files&&t.files[0],150,u=>{mkData().students[Number(t.dataset.mkphoto)].p=u;mkWrite();mkRenderAll()});
});
document.addEventListener("click",e=>{
 if(!$("#mkTable"))return;const b=e.target.closest("button");if(!b)return;
 if(b.id==="mkRmLogo"){delete mkStore.meta.logo;mkWrite();mkLogoBox();mkRefresh()}
 if(b.dataset.mkrmphoto!==undefined){delete mkData().students[Number(b.dataset.mkrmphoto)].p;mkWrite();mkRenderAll()}
});

/* ===== Certificate Maker ===== */
let ceLogoData="",cePhotoData="";
const CE_TYPES=["Achievement","Appreciation","Completion","Participation","Excellence","Good Conduct","Best Performance","Position Holder"];
const CE_TPL={"Modern Blue":{cc:"#1459a8",c2:"#1dc8e8",cls:"t-modern"},"Classic Gold":{cc:"#7a5a12",c2:"#c9a227",cls:"t-gold"},"Royal Dark":{cc:"#d4af37",c2:"#d4af37",cls:"t-dark"},"Emerald Green":{cc:"#0f6b4f",c2:"#c9a227",cls:"t-green"},"Minimal":{cc:"#17243d",c2:"#17243d",cls:"t-min"}};
function certPage(){ceLogoData="";cePhotoData="";const opt=a=>a;return `${pageHead("Certificate Maker","Choose a design, add your school logo and the recipient's photo, adjust every option, then print or save as PDF.")}<div class="two-col"><section class="panel no-print"><div class="form-grid">
${selectField("Design","ceTpl",Object.keys(CE_TPL))}${selectField("Orientation","ceOrient",["Landscape","Portrait"])}
${field("School / organization","ceSchool","School name")}${selectField("Certificate of","ceType",CE_TYPES)}
${field("Recipient name","ceName","Full name")}${field("Highlight line (optional)","ceHigh","e.g. Position: 1st · Grade A+")}
<div class="field full"><label for="ceText">Message</label><textarea id="ceText">in recognition of outstanding performance, hard work and dedication.</textarea></div>
${field("Date","ceDate","","date",new Date().toISOString().slice(0,10))}${field("Certificate number (optional)","ceNo","e.g. 2026-014")}
${field("Left signature title","ceSign1","e.g. Class Teacher")}${field("Right signature title","ceSign2","e.g. Principal")}
<div class="field"><label for="ceLogo">School logo</label><input id="ceLogo" type="file" accept="image/*"></div>
<div class="field"><label for="cePhoto">Recipient photo</label><input id="cePhoto" type="file" accept="image/*"></div>
${selectField("Photo shape","cePhotoShape",["Round","Square"])}${selectField("Seal","ceSeal",["Show seal","Hide seal"])}
${selectField("Font","ceFont",["Serif","Sans-serif"])}${selectField("Name style","ceNameStyle",["Script","Italic serif","Bold sans"])}
${field("Accent color","ceColor","","color","#1459a8")}</div>
<div class="actions">${btn("Print / Save PDF",'id="cePrint"',"primary")}${btn("Remove logo",'id="ceRmLogo"')}${btn("Remove photo",'id="ceRmPhoto"')}${btn("Save project",'id="ceSave"')}</div></section>
<section class="panel"><h2 class="no-print">Preview</h2><div id="cePreview"></div></section></div>`}
function ceRender(){
 const el=$("#cePreview");if(!el)return;
 const v=id=>($("#"+id)?.value||"").trim(),T=CE_TPL[v("ceTpl")]||CE_TPL["Modern Blue"],c=/^#[0-9a-f]{6}$/i.test(v("ceColor"))?v("ceColor"):T.cc;
 const port=v("ceOrient")==="Portrait",font=v("ceFont")==="Sans-serif"?"f-sans":"f-serif",ns={"Script":"ns-script","Italic serif":"ns-italic","Bold sans":"ns-bold"}[v("ceNameStyle")]||"ns-script";
 let ds=v("ceDate");try{if(ds)ds=new Date(ds+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}catch{}
 const meta=[ds&&"Date: "+ds,v("ceNo")&&"Certificate No: "+v("ceNo")].filter(Boolean).map(escapeHtml).join("&nbsp;&nbsp;·&nbsp;&nbsp;"),high=v("ceHigh"),seal=v("ceSeal")!=="Hide seal";
 el.innerHTML=`<div class="certwrap${port?" port":""}"><div class="cert ${T.cls} ${port?"port":"land"} ${font} ${ns}" style="--cc:${c};--c2:${T.c2}"><i class="cd cd1"></i><i class="cd cd2"></i><div class="cert-in">
<div class="cert-head"><div class="cert-hl">${ceLogoData?`<img alt="Logo" src="${ceLogoData}" class="cert-logo">`:""}</div><div class="cert-school">${escapeHtml(v("ceSchool")||"School / Organization")}</div><div class="cert-hr">${cePhotoData?`<img alt="Photo" src="${cePhotoData}" class="cert-photo${v("cePhotoShape")==="Square"?"":" round"}">`:""}</div></div>
<div class="cert-mid"><div class="cert-title">CERTIFICATE</div><div class="cert-of">OF ${escapeHtml((v("ceType")||"Achievement").toUpperCase())}</div><div class="cert-pre">This certificate is proudly presented to</div><div class="cert-name">${escapeHtml(v("ceName")||"Recipient Name")}</div><div class="cert-text">${escapeHtml(v("ceText"))}</div>${high?`<div class="cert-high">${escapeHtml(high)}</div>`:""}</div>
<div class="cert-meta">${meta}</div>
<div class="cert-foot"><div class="sg"><span></span><small>${escapeHtml(v("ceSign1")||"Signature")}</small></div>${seal?`<div class="cert-seal">★</div>`:`<div></div>`}<div class="sg"><span></span><small>${escapeHtml(v("ceSign2")||"Signature")}</small></div></div></div></div></div>`;
}
document.addEventListener("input",e=>{const id=e.target.id||"";if(/^ce[A-Z]/.test(id)&&id!=="ceLogo"&&id!=="cePhoto")ceRender()});
document.addEventListener("change",e=>{const id=e.target.id||"";if(!$("#cePreview"))return;
 if(id==="ceLogo")imgShrink(e.target.files&&e.target.files[0],400,d=>{ceLogoData=d;ceRender()});
 else if(id==="cePhoto")imgShrink(e.target.files&&e.target.files[0],600,d=>{cePhotoData=d;ceRender()});
 else if(/^ce[A-Z]/.test(id)){if(id==="ceTpl"&&$("#ceColor"))$("#ceColor").value=(CE_TPL[e.target.value]||CE_TPL["Modern Blue"]).cc;ceRender()}});
document.addEventListener("click",e=>{
 if(!$("#cePreview"))return;
 if(e.target.id==="ceRmLogo"){ceLogoData="";if($("#ceLogo"))$("#ceLogo").value="";ceRender()}
 if(e.target.id==="ceRmPhoto"){cePhotoData="";if($("#cePhoto"))$("#cePhoto").value="";ceRender()}
 if(e.target.id==="cePrint"){let st=$("#mkPageStyle");if(!st){st=document.createElement("style");st.id="mkPageStyle";document.head.append(st)}st.textContent=`@media print{@page{size:A4 ${$("#ceOrient").value==="Portrait"?"portrait":"landscape"};margin:0}}`;window.print()}
 if(e.target.id==="ceSave"){const v=id=>$("#"+id)?.value||"";saveItem("Certificate",v("ceName")||"Certificate",{design:v("ceTpl"),school:v("ceSchool"),type:v("ceType"),name:v("ceName"),text:v("ceText"),date:v("ceDate")})}
});

const theme=localStorage.getItem("mt_theme");if(theme)document.documentElement.dataset.theme=theme;
render("home");
